min_version = "2026.11.3"
monorepo_root = true

[env]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
LEFTHOOK_OUTPUT = "false"

_.file = ["{{config_root}}/.secrets.env"]

[hooks]
postinstall = "lefthook install"

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# Runs in the caller's directory, so callers pass template paths relative to it.
[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
minijinja-cli "$usage_file" "${args[@]}" | op inject
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
config_roots = ["bootstrap", "docker/edge", "kubernetes", "talos"]

[settings]
task.quiet = true

[tools]
"github:home-operations/flate" = "v0.8.0"
"aqua:mitsuhiko/minijinja" = "3.1.0"
"1password-cli" = "2.35.0"
actionlint = "1.7.12"
jq = "1.8.2"
lefthook = "2.2.2"
node = "26.13.1"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
yq = "4.54.3"
zizmor = "1.32.0"
uv = "latest"
