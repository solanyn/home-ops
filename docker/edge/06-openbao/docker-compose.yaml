---
# Renovate: quay.io/openbao/openbao
name: openbao
services:
  openbao:
    container_name: openbao
    image: quay.io/openbao/openbao:2.7.2
    # No -config flag: the image entrypoint already serves the /openbao/config
    # directory. Passing both makes OpenBao read config.hcl twice and warn.
    command: ["server"]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      # Injected at deploy time by Doco-CD from 1Password
      # (op://kubernetes/openbao/OPENBAO_STATIC_SEAL_KEY); never committed.
      OPENBAO_STATIC_SEAL_KEY: ${OPENBAO_STATIC_SEAL_KEY:?OPENBAO_STATIC_SEAL_KEY is required}
      # `bao` defaults to https://127.0.0.1:8200; the listener here is plain
      # HTTP behind Caddy, so every in-container CLI call needs this.
      BAO_ADDR: http://127.0.0.1:8200
      # The image entrypoint tries to raise the memlock rlimit as root; the
      # container runs unprivileged, so skip it (disable_mlock is set in config).
      SKIP_SETCAP: "true"
    volumes:
      # Persistent Raft data. Host path must be owned by the image's
      # unprivileged uid/gid (100:1000) -- see `just edge openbao-provision`.
      - /opt/openbao/data:/openbao/data
    configs:
      - source: openbao_config
        target: /openbao/config/config.hcl
    # No published ports: Caddy reaches openbao:8200 over the shared `edge`
    # network, and nothing else should be able to.
    healthcheck:
      # `bao status` exits 2 when sealed/uninitialized and 1 when the listener
      # is unreachable; treat sealed as healthy so an uninitialized or sealed
      # instance does not flap.
      test:
        - CMD-SHELL
        - 'rc=0; bao status -format=json >/dev/null 2>&1 || rc=$$?; [ "$$rc" -eq 0 ] || [ "$$rc" -eq 2 ]'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edge

  # Idempotent re-application of the ESO auth config (KV mount, read-only
  # policy, JWT role). Modelled as a doco-cd scheduled job, not a plain
  # one-shot: doco-cd fails a deployment when any service in the stack is in an
  # exited state, and it waits on `depends_on` one-shots. Scheduled jobs are
  # instead "prepared but left idle" on deployment (source container created,
  # never started), and one_off runs clone it per execution, so deploy
  # reconciliation never sees an exited container.
  #
  # Consequence: deploys no longer re-run it. Trigger it on demand through the
  # doco-cd job API, or let this schedule apply it.
  bootstrap:
    container_name: openbao-bootstrap
    image: python:3.13-alpine
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      # Root token, injected by doco-cd from 1Password; never committed.
      # Empty by default: doco-cd resolves every external secret before it
      # deploys any stack and aborts the whole poll when one cannot be
      # resolved, so mapping it here before the field exists would break all
      # six edge stacks. bootstrap.py prints a note and exits 0 when unset.
      OPENBAO_TOKEN: ${OPENBAO_BOOTSTRAP_TOKEN:-}
    volumes:
      - ./bootstrap.py:/bootstrap.py:ro
      # Cluster service-account JWKS: PUBLIC keys only, safe to commit.
      # Refresh with `kubectl get --raw /openid/v1/jwks > jwks.json` and commit.
      # bootstrap.py merges keys, so a stale file cannot break live ESO auth;
      # pass --replace only for a deliberate rotation.
      - ./jwks.json:/jwks.json:ro
    command:
      - python
      - /bootstrap.py
      - --jwks
      - /jwks.json
      - --addr
      - http://openbao:8200
      - --token-env
      - OPENBAO_TOKEN
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 6h"
      # Ephemeral clone per run: the source container stays `created`, so a run
      # can never leave it exited and fail the next deployment.
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"
      cd.doco.job.timeout: "10m"
      cd.doco.job.notify_on: "failure"
    networks:
      - edge

configs:
  openbao_config:
    file: ./config/config.hcl

networks:
  edge:
    external: true
    name: edge
