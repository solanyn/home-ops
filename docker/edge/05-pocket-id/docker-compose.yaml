---
name: pocket-id
services:
  pocket-id:
    container_name: pocket-id
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    restart: unless-stopped
    environment:
      APP_URL: https://id.goyangi.io
      DB_CONNECTION_STRING: /app/data/pocket-id.db
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:?POCKET_ID_ENCRYPTION_KEY is required}
      TRUST_PROXY: "true"
      UPDATE_CHECK_DISABLED: "true"
      SESSION_DURATION: "1440"
      EMAIL_LOGIN_NOTIFICATION_ENABLED: "true"
      SMTP_HOST: smtp.migadu.com
      SMTP_PORT: "465"
      SMTP_FROM: noreply@goyangi.io
      SMTP_USER: ${SMTP_RELAY_USERNAME:?SMTP_RELAY_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_RELAY_PASSWORD:?SMTP_RELAY_PASSWORD is required}
      SMTP_TLS: tls
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - edge
volumes:
  pocket-id-data:
networks:
  edge:
    external: true
    name: edge
