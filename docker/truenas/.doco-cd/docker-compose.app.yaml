---
configs:
  poll-config.yml:
    content: |
      - run_once: false
        interval: 180s
        url: https://github.com/solanyn/home-ops.git
        reference: main
secrets:
  1pw_token:
    file: /home/truenas_admin/.config/doco-cd/1pw_token
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret
services:
  app:
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    container_name: doco-cd
    environment:
      HTTP_PORT: 8080
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/truenas/
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.114.0@sha256:73b60295d651745b1701003e19ce1d5114ebfeb3446dbc4e3aeb17882e1a3568
    ports:
      - 8080:8080
      - 9120:9120
    restart: unless-stopped
    secrets:
      - 1pw_token
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data: {}
