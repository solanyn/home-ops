---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  files:
    # Miroir's NFSv4 server keeps its own recovery state here, owned by nobody at
    # mode 0700, so kopia cannot read it. An explicit list replaces the defaults.
    ignoreRules:
      - /lost+found
      - System Volume Information
      - $RECYCLE.BIN
      - "@eaDir"
      - .snapshot
      - .ganesha-recovery
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=miroir-replicated}
      # kopia's default budgets (5000 MiB/class) exceed a 5Gi cache PVC, so the
      # sweeper never runs and the cache fills the volume. Metadata applies
      # twice (index-blobs cap), so keep content + 2*metadata under capacity.
      contentCacheSizeMb: ${KOPIUR_CONTENT_CACHE_MB:=512}
      metadataCacheSizeMb: ${KOPIUR_METADATA_CACHE_MB:=1024}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: kopiur-s3
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  verification:
    # quick = are the blobs and indexes intact? verifyFilesPercent makes it read
    # a slice of file contents too, so it is cheap enough to run nightly.
    quick:
      schedule:
        cron: ${KOPIUR_VERIFY_QUICK_CRON:=H 3 * * *}
        jitter: 30m
        timezone: Australia/Sydney
    # deep = scratch-restore the latest snapshot into a throwaway volume, i.e.
    # an actual recovery drill. Weekly is plenty. The scratch size and class come
    # from moverDefaults.scratch on ClusterRepository/kopiur-s3 so the largest
    # volume (hermes, ~42 GiB) is not hardcoded into every policy.
    deep:
      schedule:
        cron: ${KOPIUR_VERIFY_DEEP_CRON:=H 5 * * 0}
        jitter: 1h
        timezone: Australia/Sydney
    # Both tiers share this. 10% of each file is read and hashed in the quick tier.
    verifyFilesPercent: 10
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir-snap}
