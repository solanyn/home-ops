---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kopiur.home-operations.com
      kind: Restore
    patch: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      metadata:
        name: this-is-ignored
      spec:
        mover:
          privilegedMode: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          podSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
