---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-anubis
spec:
  chartRef:
    kind: OCIRepository
    name: ${APP}-anubis
  interval: 10m
  values:
    controllers:
      anubis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.27.0
            env:
              BIND: ":8080"
              DIFFICULTY: '${ANUBIS_DIFFICULTY:="4"}'
              ED25519_PRIVATE_KEY_HEX:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-anubis-key-secret
                    key: ED25519_PRIVATE_KEY_HEX
              METRICS_BIND: ":9090"
              OG_EXPIRY_TIME: "24h"
              OG_PASSTHROUGH: "true"
              POLICY_FNAME: "/etc/anubis/policy.yaml"
              SERVE_ROBOTS_TXT: "true"
              TARGET: "${ANUBIS_TARGET}"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["anubis", "--healthcheck"]
                  initialDelaySeconds: 1
                  periodSeconds: 10
              readiness: *probe
              startup: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    route:
      main:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - ${ANUBIS_HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: ${APP}-anubis
                port: 8080
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Real-Ip
                      value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            timeouts:
              request: 300s
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    configMaps:
      policy:
        suffix: policy
        data:
          policy.yaml: |-
            bots:
              - name: declared-ai-crawler
                user_agent_regex: (?i:GPTBot|CCBot|Google-Extended|Bytespider|Amazonbot|Applebot-Extended|Meta-ExternalAgent|meta-webindexer)
                action: DENY
              - import: (data)/meta/default-config.yaml
              - name: well-known
                path_regex: ^/\\.well-known/.*$
                action: ALLOW
              - name: favicon
                path_regex: ^/favicon\\.ico$
                action: ALLOW
              - name: robots-txt
                path_regex: ^/robots\\.txt$
                action: ALLOW
              - name: sitemap
                path_regex: ^/sitemap\\.xml$
                action: ALLOW
              - name: webmanifest
                path_regex: ^/site\\.webmanifest$
                action: ALLOW
              - name: feeds
                path_regex: \\.(rss|atom|xml)$
                action: ALLOW
            dnsbl: false
    persistence:
      policy:
        type: configMap
        identifier: policy
        globalMounts:
          - path: /etc/anubis
            readOnly: true
    service:
      anubis:
        controller: anubis
        ports:
          http:
            port: 8080
            protocol: HTTP
          metrics:
            port: 9090
            protocol: HTTP
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s
