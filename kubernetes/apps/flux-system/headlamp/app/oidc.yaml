---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
spec:
  clientID: headlamp
  callbackUrls:
    - https://headlamp.goyangi.io/oidc-callback
  logoutCallbackUrls:
    - https://headlamp.goyangi.io
  allowedUserGroups:
    - name: admin
      namespace: default
  secret:
    name: headlamp-oidc
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
