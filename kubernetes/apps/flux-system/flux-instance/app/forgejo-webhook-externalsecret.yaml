---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-webhook-token
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-webhook-token-secret
    template:
      data:
        token: "{{ .FLUX_FORGEJO_WEBHOOK_TOKEN }}"
  dataFrom:
    - extract:
        key: flux
