---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm-tools
spec:
  chartRef:
    kind: OCIRepository
    name: romm-tools
  interval: 1h
  values:
    controllers:
      switch-importer:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.12-alpine
            env:
              UV_CACHE_DIR: /tmp/uv-cache
            command:
              - uv
            args:
              - run
              - --with
              - nsz
              - python
              - /scripts/convert.py
            resources: {}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      script:
        data:
          convert.py: |
            #!/usr/bin/env python3
            import json
            import os
            import re
            import shutil
            import subprocess
            import urllib.parse
            import urllib.request
            from pathlib import Path

            QBT = "http://qbittorrent.default.svc.cluster.local"
            DEST = Path("/media/games/roms")
            SOURCES = [
                # Switch imports retain the existing copy-and-cleanup behaviour.
                (Path("/media/downloads/torrents/complete/switch"), "switch", "copy", True),
                (Path("/media/downloads/torrents/complete/games"), "games", "hardlink", False),
                # Minerva archives are preserved for seeding and never cleaned up.
                (Path("/media/downloads/torrents/complete/roms/Minerva_Myrient"), "roms", "hardlink", False),
            ]

            MINERVA_PLATFORMS = {
                "Nintendo - Game Boy Advance": "gba",
                "Nintendo - Nintendo 3DS": "3ds",
                "Nintendo - Nintendo 3DS (Digital) (CDN)": "3ds",
                "Nintendo - Nintendo 64 (BigEndian)": "n64",
                "Nintendo - Nintendo DS (Decrypted)": "nds",
                "Nintendo - Nintendo Entertainment System (Headerless)": "nes",
                "Nintendo - Super Nintendo Entertainment System": "snes",
                "Nintendo - GameCube - NKit RVZ [zstd-19-128k]": "ngc",
                "Nintendo - Wii - NKit RVZ [zstd-19-128k]": "wii",
                "Non-Redump - Nintendo - Wii U": "wiiu",
                "Non-Redump - Sony - PlayStation Portable": "psp",
                "Sony - PlayStation": "psx",
                "Sony - PlayStation 2": "ps2",
                "Sony - PlayStation Portable": "psp",
                "Sony - PlayStation Portable (PSN) (Decrypted)": "psp",
                "Sega - Game Gear": "gg",
                "Sega - Master System - Mark III": "sms",
                "Sega - Mega Drive - Genesis": "genesis",
                "Sega - Dreamcast": "dc",
                "Sega - Saturn": "saturn",
                "NEC - PC Engine - TurboGrafx-16": "pcengine",
                "Microsoft - Xbox": "xbox",
                "Microsoft - Xbox 360": "xbox360",
            }
            MINERVA_EXTENSIONS = {".zip", ".7z", ".rar", ".chd", ".rvz", ".iso", ".cue", ".bin"}
            SWITCH_EXTENSIONS = {".nsp", ".nsz", ".xci"}
            SWITCH_MOD_DIRECTORIES = {
                "atmosphere",
                "exefs",
                "romfs",
                "sxos",
            }

            def normalize(name):
                return re.sub(r'\s*\(\d+\.\d+\s+GB\)', '', name)

            def game_info(filename):
                name = normalize(filename.rsplit('.', 1)[0])
                dlc = re.search(r'^(.+?)\s*\[DLC[^\]]*\]\s*\[[\dA-F]{16}\]', name)
                base = re.match(r'^(.+?)\s*\[[\dA-F]{16}\]', name)
                game = (dlc or base).group(1).strip() if (dlc or base) else name.split('[')[0].strip()
                if dlc:
                    return game, "dlc"
                ver = re.search(r'\[v(\d+)\]', filename)
                return game, "update" if ver and int(ver.group(1)) > 0 else "base"

            def exists(dest):
                if dest.exists():
                    return True
                norm = normalize(dest.name)
                return any(normalize(f.name) == norm for f in dest.parent.glob("*.nsp"))

            def minerva_location(source, src_dir):
                relative = source.relative_to(src_dir)
                parts = relative.parts
                for index, part in enumerate(parts[:-1]):
                    platform = MINERVA_PLATFORMS.get(part)
                    if platform:
                        return platform, Path(*parts[index + 1:])
                    if "[T-En] Collection" in part:
                        base = part.split(" [T-En] Collection", 1)[0]
                        platform = MINERVA_PLATFORMS.get(base)
                        if platform:
                            return platform, Path(*parts[index + 1:])
                return None, None

            def destination(source, src_dir, category):
                if category == "roms":
                    platform, relative = minerva_location(source, src_dir)
                    if not platform:
                        return None
                    return DEST / platform / relative
                game, kind = game_info(source.name)
                target = DEST / "switch" / game if kind == "base" else DEST / "switch" / game / kind
                return target / source.name

            def qbt_torrents(category):
                url = f"{QBT}/api/v2/torrents/info?" + urllib.parse.urlencode({"category": category})
                with urllib.request.urlopen(url) as r:
                    return json.loads(r.read())

            def qbt_remove(hashes):
                body = urllib.parse.urlencode({
                    "hashes": "|".join(hashes),
                    "deleteFiles": "false",
                }).encode()
                urllib.request.urlopen(urllib.request.Request(f"{QBT}/api/v2/torrents/delete", data=body))
                print(f"Removed {len(hashes)} torrents from qBittorrent")

            def match_torrents(torrents, src_dir, cleaned):
                cleaned_parents = {f.parent for f in cleaned}
                hashes = set()
                for t in torrents:
                    content = Path(t["content_path"])
                    if content in cleaned or content.parent in cleaned_parents or content in cleaned_parents:
                        hashes.add(t["hash"])
                return hashes

            def transfer(source, dest, mode):
                dest.parent.mkdir(parents=True, exist_ok=True)
                if dest.exists():
                    if dest.stat().st_size != source.stat().st_size:
                        raise RuntimeError(f"destination exists with different size: {dest}")
                    if mode == "hardlink" and os.stat(dest).st_ino != os.stat(source).st_ino:
                        raise RuntimeError(f"destination exists but is not the source hardlink: {dest}")
                    return "existing"
                if mode == "hardlink":
                    if os.stat(source).st_dev != os.stat(dest.parent).st_dev:
                        raise OSError(f"hardlink requires one filesystem: {source} -> {dest}")
                    os.link(source, dest)
                    if os.stat(source).st_ino != os.stat(dest).st_ino:
                        raise RuntimeError(f"hardlink verification failed: {dest}")
                    return "hardlinked"
                if mode == "copy":
                    tmp = dest.with_suffix(dest.suffix + ".tmp")
                    try:
                        shutil.copy2(source, tmp)
                        tmp.replace(dest)
                    finally:
                        tmp.unlink(missing_ok=True)
                    return "copied"
                raise ValueError(f"unknown transfer mode: {mode}")

            def import_files(src_dir, category, mode, cleanup):
                cleaned = []
                for source in src_dir.rglob("*"):
                    if not source.is_file() or source.name.startswith(".") or ".unwanted" in source.parts:
                        continue
                    if category in {"switch", "games"} and SWITCH_MOD_DIRECTORIES.intersection(source.parts):
                        continue
                    if category == "roms" and source.suffix.lower() not in MINERVA_EXTENSIONS:
                        continue
                    if category in {"switch", "games"} and source.suffix.lower() not in SWITCH_EXTENSIONS:
                        continue
                    if category != "roms" and source.suffix.lower() == ".nsz":
                        game, kind = game_info(source.name)
                        dest = DEST / "switch" / game / (kind if kind != "base" else "") / source.with_suffix(".nsp").name
                        if dest.exists():
                            cleaned.append(source)
                            continue
                        dest.parent.mkdir(parents=True, exist_ok=True)
                        print(f"Converting {source.name}")
                        subprocess.run(["nsz", "-D", str(source), "-o", str(dest.parent)], check=True)
                        cleaned.append(source)
                        continue
                    dest = destination(source, src_dir, category)
                    if dest is None:
                        print(f"Skipping unmapped source: {source}")
                        continue
                    result = transfer(source, dest, mode)
                    print(f"{result}: {source} -> {dest}")
                    if cleanup:
                        cleaned.append(source)
                return cleaned

            def cleanup_sources(category, src_dir, cleaned):
                torrents = qbt_torrents(category)
                hashes = match_torrents(torrents, src_dir, cleaned)
                if hashes:
                    qbt_remove(hashes)
                for f in cleaned:
                    f.unlink()
                    print(f"Deleted {f.name}")
                for d in sorted(src_dir.rglob("*"), reverse=True):
                    if d.is_dir() and not any(d.iterdir()):
                        d.rmdir()

            def process():
                lock_path = DEST / ".romm-tools.lock"
                try:
                    lock_path.mkdir()
                except FileExistsError:
                    print("Another romm-tools run is active; exiting")
                    return
                try:
                    (lock_path / "owner").write_text(
                        f"pid={os.getpid()}\\n", encoding="utf-8"
                    )
                    for src_dir, category, mode, cleanup in SOURCES:
                        if not src_dir.exists():
                            continue
                        try:
                            cleaned = import_files(src_dir, category, mode, cleanup)
                        except Exception as e:
                            print(f"Import failed for {src_dir}: {e}")
                            continue
                        if cleanup and cleaned:
                            try:
                                cleanup_sources(category, src_dir, cleaned)
                            except Exception as e:
                                print(f"Cleanup failed for {category}: {e}")
                finally:
                    try:
                        (lock_path / "owner").unlink(missing_ok=True)
                        lock_path.rmdir()
                    except FileNotFoundError:
                        pass

            if __name__ == "__main__":
                process()
    persistence:
      script:
        type: configMap
        identifier: script
        globalMounts:
          - path: /scripts
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
      prod-keys:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/games/bios/switch/20.5.0
        globalMounts:
          - path: /.switch/prod.keys
            subPath: prod.keys
            readOnly: true
      tmp:
        type: emptyDir
