---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm-tools
spec:
  chartRef:
    kind: OCIRepository
    name: romm-tools
  interval: 1h
  values:
    controllers:
      switch-importer:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        initContainers:
          00-sync-ntool:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.1@sha256:fb5eaafc672baa65f64d1ebb5c2e63e29b737237fddd1d55da187f1f052dc2de
            args:
              - --repo=https://github.com/Dimensional/ntool.git
              - --ref=460c7ed41385223ffac686d7364ae1a09994ebbb
              - --root=/tmp/tooling/git-sync
              - --link=current
              - --one-time
              - --group-write
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          prepare-ntool:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.12-alpine
            command: [sh, -eu, -c]
            args:
              - |
                test -f /tooling/git-sync/current/ntool.py
                mkdir -p /tooling/project
                cat > /tooling/project/pyproject.toml <<'EOF'
                [project]
                name = "romm-ntool-runtime"
                version = "0.0.0"
                requires-python = ">=3.12,<3.13"
                dependencies = ["pycryptodome==3.23.0"]

                [tool.uv]
                package = false
                EOF
                uv lock --directory /tooling/project
                uv sync --directory /tooling/project --locked
            env:
              NTOOL_COMMIT: "460c7ed41385223ffac686d7364ae1a09994ebbb"
              UV_CACHE_DIR: /tmp/uv-cache
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.12-alpine
            env:
              UV_CACHE_DIR: /tmp/uv-cache
              NTOOL_PROJECT: /tooling/project
              NTOOL_CHECKOUT: /tooling/git-sync/current
              NTOOL_COMMIT: "460c7ed41385223ffac686d7364ae1a09994ebbb"
              CLEANUP_LIBRARY: "true"
            command:
              - uv
            args:
              - run
              - --with
              - nsz
              - python
              - /scripts/import.py
            resources: {}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      script:
        type: configMap
        name: romm-tools-script
        globalMounts:
          - path: /scripts
      tooling:
        type: emptyDir
        advancedMounts:
          switch-importer:
            00-sync-ntool:
              - path: /tmp/tooling
            prepare-ntool:
              - path: /tooling
              - path: /tmp/tooling
            app:
              - path: /tooling
                readOnly: true
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
      prod-keys:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/games/bios/switch/20.5.0
        globalMounts:
          - path: /.switch/prod.keys
            subPath: prod.keys
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
