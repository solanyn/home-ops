# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: autobrr-secret
    template:
      data:
        INIT_POSTGRES_HOST: postgres-rw.storage.svc.cluster.local
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: "{{ .AUTOBRR_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .AUTOBRR_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_DBNAME: autobrr
        AUTOBRR__DATABASE_TYPE: postgres
        AUTOBRR__POSTGRES_DATABASE: autobrr
        AUTOBRR__POSTGRES_HOST: postgres-rw.storage.svc.cluster.local
        AUTOBRR__POSTGRES_USER: "{{ .AUTOBRR_POSTGRES_USER }}"
        AUTOBRR__POSTGRES_PASS: "{{ .AUTOBRR_POSTGRES_PASSWORD }}"
        AUTOBRR__POSTGRES_PORT: "5432"
        AUTOBRR__OIDC_ENABLED: "true"
        AUTOBRR__OIDC_ISSUER: https://id.goyangi.io/
        AUTOBRR__OIDC_CLIENT_ID: autobrr
        AUTOBRR__OIDC_REDIRECT_URL: https://autobrr.goyangi.io/api/auth/oidc/callback
  dataFrom:
    - extract:
        key: autobrr
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: autobrr-session
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  noUpper: false
  secretKeys:
    - SESSION_SECRET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr-session
spec:
  refreshPolicy: CreatedOnce
  target:
    name: autobrr-session-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        AUTOBRR__SESSION_SECRET: "{{ .SESSION_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: autobrr-session
