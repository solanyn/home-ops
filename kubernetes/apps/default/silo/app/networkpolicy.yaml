---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: silo
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Gateway routes for the main UI and the Jellyfin/ABS compatibility ports
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8096"
              protocol: TCP
            - port: "13378"
              protocol: TCP
    # The transcode node registers itself against the server
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: silo
            app.kubernetes.io/controller: transcode
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Server <-> transcode node, both directions resolved by pod identity
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: silo
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Metadata providers, plugin catalog and Jellyfin web assets
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
