---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-secret
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgres://silo:{{ .SILO_POSTGRES_PASSWORD | urlquery }}@postgres-rw.storage.svc.cluster.local:5432/silo?sslmode=require&connect_timeout=10"
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: silo
