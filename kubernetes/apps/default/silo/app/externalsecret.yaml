---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: silo
        password: "{{ .SILO_POSTGRES_PASSWORD }}"
        uri: "postgres://silo:{{ .SILO_POSTGRES_PASSWORD | urlquery }}@postgres-rw.storage.svc.cluster.local:5432/silo?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: silo
    - extract:
        key: cloudnative-pg
