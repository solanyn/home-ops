---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outline
spec:
  chartRef:
    kind: OCIRepository
    name: outline
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      outline:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: outline-secret
        containers:
          app:
            image:
              repository: docker.getoutline.com/outlinewiki/outline
              tag: 1.10.1
            env:
              URL: https://outline.goyangi.io
              PORT: &port 3000
              NODE_ENV: production
              REDIS_URL: redis://redis.storage.svc.cluster.local:6379/3
              FILE_STORAGE: local
              FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
              OIDC_CLIENT_ID: outline
              OIDC_AUTH_URI: https://id.goyangi.io/authorize
              OIDC_TOKEN_URI: https://id.goyangi.io/api/oidc/token
              OIDC_USERINFO_URI: https://id.goyangi.io/api/oidc/userinfo
              OIDC_LOGOUT_URI: https://id.goyangi.io/api/oidc/end-session
              OIDC_USERNAME_CLAIM: preferred_username
              OIDC_DISPLAY_NAME: Pocket ID
              OIDC_SCOPES: openid profile email groups
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: outline-oidc
                    key: client_secret
            envFrom:
              - secretRef:
                  name: outline-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - outline.goyangi.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /var/lib/outline/data
