---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otbr
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: multus-networks
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/default/otbr/app
  postBuild:
    substitute:
      APP: otbr
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_CONTENT_CACHE_MB: "128"
      KOPIUR_METADATA_CACHE_MB: "256"
      KOPIUR_PGID: "0"
      KOPIUR_PUID: "0"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
