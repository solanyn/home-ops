---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: website
spec:
  endpoints:
    - dnsName: goyangi.io
      recordType: CNAME
      targets:
        - external.goyangi.io
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "true"
