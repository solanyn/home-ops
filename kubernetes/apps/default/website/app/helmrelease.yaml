---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: website
spec:
  chartRef:
    kind: OCIRepository
    name: website
  interval: 10m
  values:
    controllers:
      website:
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31.6-alpine@sha256:e75f89810bf5bfbcf58a1cfb32a1a11de55b7623d732e67735d513b720d7436a
            env:
              NGINX_ENTRYPOINT_QUIET_LOGS: "1"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      assets:
        type: image
        # renovate: datasource=docker depName=ghcr.io/solanyn/website-assets
        image: ghcr.io/solanyn/website-assets:2026.09.6
        globalMounts:
          - path: /usr/share/nginx/html
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
