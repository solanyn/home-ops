---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
spec:
  targetNamespace: default
  components:
    - ../../../../components/anubis
  interval: 1h
  path: ./kubernetes/apps/default/website/app
  postBuild:
    substitute:
      APP: website
      ANUBIS_HOSTNAME: goyangi.io
      ANUBIS_TARGET: http://website.default.svc.cluster.local:8080
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
