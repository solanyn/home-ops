---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bindery
spec:
  chartRef:
    kind: OCIRepository
    name: bindery
  interval: 10m
  values:
    controllers:
      bindery:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/vavallee/bindery
              tag: v1.34.0@sha256:91f9fcfca1116d5e44090282063fc9c2a6c7283752e1a62df2c5953af4c12faf
            env:
              TZ: Australia/Sydney
              BINDERY_PORT: &port 8787
              BINDERY_DATA_DIR: /config
              BINDERY_DB_PATH: /config/bindery.db
              BINDERY_LIBRARY_DIR: /media/library/books
              BINDERY_AUDIOBOOK_DIR: /media/library/audiobooks
              BINDERY_DOWNLOAD_DIR: /media/downloads/torrents/complete/books
              BINDERY_AUDIOBOOK_DOWNLOAD_DIR: /media/downloads/torrents/complete/audiobooks
              BINDERY_CONTACT: andrew@goyangi.io
              BINDERY_ENFORCE_TENANCY: "true"
              BINDERY_TELEMETRY_DISABLED: "true"
              BINDERY_PUID: "1000"
              BINDERY_PGID: "1000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "{{ .Release.Name }}.goyangi.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
