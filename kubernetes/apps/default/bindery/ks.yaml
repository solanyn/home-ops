---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bindery
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: bindery
  components:
    - ../../../../components/kopiur
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/default/bindery/app
  postBuild:
    substitute:
      APP: bindery
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
