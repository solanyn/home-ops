---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slskd
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/default/slskd/app
  postBuild:
    substitute:
      APP: slskd
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
