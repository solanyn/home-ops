---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: romarr
  annotations:
    reconcile.fluxcd.io/requestedAt: "2026-08-08T18:00:00Z"
spec:
  oidc:
    clientID: romarr
    clientSecret:
      name: romarr-oidc
    logoutPath: /logout
    provider:
      issuer: https://id.goyangi.io/
    redirectURL: https://romarr.goyangi.io/oauth2/callback
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: romarr
