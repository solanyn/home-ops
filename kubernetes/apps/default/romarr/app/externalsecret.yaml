---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: romarr-secret
    template:
      data:
        PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        QBITTORRENT_USER: "{{ .QBITTORRENT_USER }}"
        QBITTORRENT_PASS: "{{ .QBITTORRENT_PASSWORD }}"
        LIBRARY_API_KEY: "{{ .ROMM_API_TOKEN }}"
        ROMARR_OIDC_ENABLED: "true"
        ROMARR_OIDC_DISPLAY_NAME: Pocket ID
        ROMARR_OIDC_ISSUER: https://id.goyangi.io
        ROMARR_OIDC_CLIENT_ID: romarr
        ROMARR_OIDC_SCOPES: openid profile email groups
        ROMARR_OIDC_GROUP: user
  dataFrom:
    - extract:
        key: prowlarr
    - extract:
        key: qbittorrent
    - extract:
        key: romm
