---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pkvault
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/default/pkvault/app
  postBuild:
    substitute:
      APP: pkvault
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
