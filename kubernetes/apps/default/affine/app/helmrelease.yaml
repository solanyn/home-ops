# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine
spec:
  chartRef:
    kind: OCIRepository
    name: affine
  interval: 1h
  values:
    controllers:
      affine:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          predeploy:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
            command: ["sh", "-c"]
            args: ["node ./scripts/self-host-predeploy.js"]
            envFrom: &envFrom
              - secretRef:
                  name: affine-secret
            env: &env
              REDIS_SERVER_HOST: dragonfly-cluster.storage.svc.cluster.local
              REDIS_SERVER_PORT: "6379"
              REDIS_SERVER_DATABASE: "7"
              AFFINE_INDEXER_ENABLED: "false"
              AFFINE_BACKEND_RUNTIME_CONFIG_PATH: &configPath /app/config.json
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 20m, memory: 256Mi }
              limits: { memory: 1Gi }
        containers:
          app:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
            envFrom: *envFrom
            env: *env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 3010
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests: { cpu: 100m, memory: 1Gi }
              limits: { memory: 4Gi }
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: affine
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "{{ .Release.Name }}.goyangi.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node/.affine
      runtime-config:
        type: configMap
        identifier: affine-runtime-config
        advancedMounts:
          affine:
            app:
              - path: *configPath
                subPath: config.json
                readOnly: true
            predeploy:
              - path: *configPath
                subPath: config.json
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
    configMaps:
      affine-runtime-config:
        data:
          config.json: |
            {
              "$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
              "copilot": {
                "enabled": true,
                "byok": {
                  "enabled": true,
                  "allowCustomEndpoint": true,
                  "allowPrivateEndpoint": true
                }
              }
            }
