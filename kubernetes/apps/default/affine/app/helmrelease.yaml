# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine
spec:
  chartRef:
    kind: OCIRepository
    name: affine
  interval: 1h
  values:
    controllers:
      affine:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
            command: ["sh", "-c"]
            args:
              - >-
                mkdir -p /config/config /config/storage &&
                cp -f /seed/config.json /config/config/config.json &&
                chown -R 1000:1000 /config
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 5m, memory: 8Mi }
              limits: { memory: 16Mi }
          predeploy:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
            command: ["sh", "-c"]
            args: ["node ./scripts/self-host-predeploy.js"]
            envFrom: &envFrom
              - secretRef:
                  name: affine-secret
            env:
              REDIS_SERVER_HOST: 127.0.0.1
              AFFINE_INDEXER_ENABLED: "false"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 20m, memory: 256Mi }
              limits: { memory: 1Gi }
        containers:
          app:
            image:
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
            envFrom: *envFrom
            env:
              REDIS_SERVER_HOST: 127.0.0.1
              AFFINE_INDEXER_ENABLED: "false"
              AFFINE_SERVER_HTTPS: "true"
              AFFINE_BACKEND_RUNTIME_CONFIG_PATH: /root/.affine/config/config.json
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 3010
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests: { cpu: 100m, memory: 1Gi }
              limits: { memory: 4Gi }
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          redis:
            image:
              repository: docker.io/library/redis
              tag: 7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
            args: ["--save", "", "--appendonly", "no"]
            probes:
              liveness: &redisProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["redis-cli", "ping"]
              readiness: *redisProbes
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 256Mi }
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: affine
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "{{ .Release.Name }}.goyangi.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          affine:
            init-config:
              - path: /config
            app:
              - path: /root/.affine
            predeploy:
              - path: /root/.affine
      config-seed:
        type: configMap
        identifier: affine-config
        advancedMounts:
          affine:
            init-config:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
