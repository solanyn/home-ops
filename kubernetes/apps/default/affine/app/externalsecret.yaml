# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: affine-secret
    template:
      data:
        DATABASE_URL: "postgresql://affine:{{ .AFFINE_POSTGRES_PASSWORD }}@postgres-rw.storage.svc.cluster.local:5432/affine?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: affine
