# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: affine
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: cloudnative-pg-databases
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/default/affine/app
  postBuild:
    substitute:
      APP: affine
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
