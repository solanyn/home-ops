---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: floppy
spec:
  oidc:
    clientID: floppy
    clientSecret:
      name: floppy-oidc
    logoutPath: /oauth2/logout
    provider:
      issuer: https://id.goyangi.io/
    redirectURL: https://floppy.goyangi.io/oauth2/callback
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: floppy
