# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: floppy
spec:
  chartRef:
    kind: OCIRepository
    name: floppy
  interval: 1h
  values:
    controllers:
      floppy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dannyvfilms/floppy
              tag: 26.10.29@sha256:5e88307d4af68ee397f0233670b4f35f50d6ce5d12c34fde6b9ecab74ac4836e
            env:
              TZ: &tz Australia/Sydney
              FLOPPY_PORT: &port 8000
              ALLOWED_HOSTS: "floppy.goyangi.io,.floppy.default.svc.cluster.local,localhost,127.0.0.1"
              DEBUG: "False"
              DEMO_ACCOUNT_ENABLED: "False"
              ADMIN_ENABLED: "False"
              # Share the cluster Dragonfly rather than running a second Redis.
              REDIS_URL: redis://dragonfly-cluster.storage.svc.cluster.local:6379/5
              DB_HOST: postgres-rw.storage.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: floppy
              DB_USER: floppy
              # Floppy needs these individually; DATABASE_URL is not supported.
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: floppy-secret
                    key: DB_PASSWORD
              # Keep the logs, generated key and exports on the one backed-up
              # volume; /floppy itself holds the image's application code.
              BACKUP_DIR: /floppy/db/backups
              LOG_DIR: /floppy/db/logs
              FLOPPY_DATA_DIR: /floppy/db
              HOME: /tmp
              # Signs sessions and encrypts stored integration credentials.
              # Rotating it invalidates both, so it lives in 1Password.
              SECRET:
                valueFrom:
                  secretKeyRef:
                    name: floppy-secret
                    key: SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/
                    port: *port
                    # Django rejects an unknown Host with DisallowedHost, and the
                    # kubelet defaults to the pod IP. Probe via an allowed name.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              # Enough for the entrypoint's groupmod/usermod/chown and for nginx
              # to write its config and bind; everything else stays dropped.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Floppy's image is built to start as root: the entrypoint remaps PUID/PGID
      # with groupmod/usermod, chowns its data dirs, and supervisord runs nginx
      # as root because it rewrites /etc/nginx/nginx.conf on every start. A
      # non-root start cannot do any of that, so run as root but keep the
      # capability set to exactly what those steps need — the alternative
      # (dropping ALL) fails at the first chown.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.goyangi.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /floppy/db
      # The image's runtime entrypoint unconditionally does `mkdir -p /run/floppy`
      # and writes the resolved port there before dropping privileges. /run is
      # root-owned in the image and we run as 1000, so give it a private writable
      # scratch dir instead of escalating to root.
      runtime:
        type: emptyDir
        sizeLimit: 16Mi
        globalMounts:
          - path: /run/floppy
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
