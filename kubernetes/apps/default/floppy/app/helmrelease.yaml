# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: floppy
spec:
  chartRef:
    kind: OCIRepository
    name: floppy
  interval: 1h
  values:
    controllers:
      floppy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dannyvfilms/floppy
              tag: 26.10.29@sha256:5e88307d4af68ee397f0233670b4f35f50d6ce5d12c34fde6b9ecab74ac4836e
            env:
              TZ: &tz Australia/Sydney
              PUID: &puid "1000"
              PGID: &pgid "1000"
              FLOPPY_PORT: &port 8000
              DEBUG: "False"
              DEMO_ACCOUNT_ENABLED: "False"
              ADMIN_ENABLED: "False"
              # Share the cluster Dragonfly rather than running a second Redis.
              REDIS_URL: redis://dragonfly-cluster.storage.svc.cluster.local:6379/5
              DB_HOST: postgres-rw.storage.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: floppy
              DB_USER: floppy
              # Floppy needs these individually; DATABASE_URL is not supported.
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: floppy-secret
                    key: DB_PASSWORD
              # Keep the logs, generated key and exports on the one backed-up
              # volume; /floppy itself holds the image's application code.
              BACKUP_DIR: /floppy/db/backups
              FLOPPY_DATA_DIR: /floppy/db
              HOME: /tmp
              # Signs sessions and encrypts stored integration credentials.
              # Rotating it invalidates both, so it lives in 1Password.
              SECRET:
                valueFrom:
                  secretKeyRef:
                    name: floppy-secret
                    key: SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The image's entrypoint maps PUID/PGID with groupmod/usermod and chowns
      # its data dirs, so it has to start as root and drops privileges itself.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.goyangi.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /floppy/db
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
