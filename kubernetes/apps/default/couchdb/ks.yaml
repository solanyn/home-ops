---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: couchdb
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: couchdb
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/default/couchdb/app
  postBuild:
    substitute:
      APP: couchdb
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "5984"
      KOPIUR_PGID: "5984"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
