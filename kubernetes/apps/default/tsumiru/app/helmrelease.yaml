---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tsumiru
spec:
  chartRef:
    kind: OCIRepository
    name: tsumiru
  interval: 1h
  values:
    controllers:
      tsumiru:
        initContainers:
          install-web:
            image:
              repository: python
              tag: 3.14-alpine
            command: [python3, -c]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            args:
              - |
                import urllib.request
                import zipfile
                from pathlib import Path
                archive = Path('/tmp/tsumiru.zip')
                urllib.request.urlretrieve('https://github.com/Suwayomi/Suwayomi-Tsumiru/releases/download/v1.1.5/tsumiru-v1.1.5-web.zip', archive)
                with zipfile.ZipFile(archive) as bundle:
                    bundle.extractall('/www')
        containers:
          app:
            image:
              repository: nginx
              tag: 1.29-alpine
            env:
              NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "0"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - tsumiru.goyangi.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      web:
        type: emptyDir
        advancedMounts:
          tsumiru:
            install-web:
              - path: /www
            app:
              - path: /usr/share/nginx/html
      nginx-cache:
        type: emptyDir
        advancedMounts:
          tsumiru:
            app:
              - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        advancedMounts:
          tsumiru:
            app:
              - path: /var/run
