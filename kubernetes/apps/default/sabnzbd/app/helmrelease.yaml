---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:07790a7829201d9ea302e8b862078beac4b1a07003fe8359e3f069b6bcd84a95
            env:
              SABNZBD__PORT: &port 80
              SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd.goyangi.io,sabnzbd.default.svc.cluster.local
              SABNZBD__HOST: 0.0.0.0
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
        initContainers:
          set-download-dirs:
            image:
              repository: busybox
              tag: 1.38
            command: ["/bin/sh", "-c"]
            args:
              # The image entrypoint only rewrites api_key, nzb_key and the host
              # allowlists from the environment, so download_dir/complete_dir
              # keep their defaults and capture downloads inside /config, a 5Gi
              # volume, instead of the NAS. Patch the ini before SABnzbd reads
              # it; the sed is a no-op once the values are already correct.
              - >-
                [ -f /config/sabnzbd.ini ] &&
                sed -i
                -e "s|^download_dir *=.*$|download_dir = /media/downloads/usenet/incomplete|"
                -e "s|^complete_dir *=.*$|complete_dir = /media/downloads/usenet/complete|"
                /config/sabnzbd.ini;
                exit 0
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - sabnzbd.goyangi.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
          - path: /media/downloads/usenet/incomplete
            subPath: downloads/usenet/incomplete
          - path: /media/downloads/usenet/complete
            subPath: downloads/usenet/complete
      tmp:
        type: emptyDir
        sizeLimit: 50Gi
