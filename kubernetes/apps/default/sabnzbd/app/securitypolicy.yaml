---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sabnzbd
spec:
  oidc:
    clientID: sabnzbd
    clientSecret:
      name: sabnzbd-oidc
    logoutPath: /logout
    provider:
      issuer: https://id.goyangi.io
    redirectURL: https://sabnzbd.goyangi.io/oauth2/callback
    refreshToken: true
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sabnzbd
