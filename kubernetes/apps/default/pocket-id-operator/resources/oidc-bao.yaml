---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bao
spec:
  clientID: bao
  description: OpenBao administration
  # The UI flow needs /ui/vault/auth/<mount>/oidc/callback; the CLI flow uses a
  # loopback listener. Both must be registered or one of the two logins fails.
  callbackUrls:
    - https://bao.goyangi.io/ui/vault/auth/oidc/oidc/callback
    - http://localhost:8250/oidc/callback
  logoutCallbackUrls:
    - https://bao.goyangi.io
  allowedUserGroups:
    - name: admin
  # 1Password is the source of truth for the client secret rather than Pocket
  # ID: the operator never generates or rotates it while this is set, and
  # neither Pocket ID nor OpenBao can hand the value back once stored.
  clientSecretRef:
    name: bao-oidc-client
    key: client-secret
  secret:
    name: bao-oidc
    keys:
      clientSecret: client-secret
