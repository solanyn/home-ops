---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ac-pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ac-pocket-id
  dataFrom:
    - extract:
        key: ac
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bao-oidc-client
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bao-oidc-client
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .OPENBAO_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: OPENBAO_OIDC_CLIENT_SECRET
      remoteRef:
        key: openbao
        property: OPENBAO_OIDC_CLIENT_SECRET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ph-pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ph-pocket-id
  dataFrom:
    - extract:
        key: ph
