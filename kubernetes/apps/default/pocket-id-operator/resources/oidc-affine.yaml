---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: affine
spec:
  clientID: affine
  description: AFFiNE workspace
  # AFFiNE hardcodes the callback as <public_url>/oauth/callback.
  callbackUrls:
    - https://affine.goyangi.io/oauth/callback
  logoutCallbackUrls:
    - https://affine.goyangi.io
  allowedUserGroups:
    - name: user
  secret:
    name: affine-oidc
