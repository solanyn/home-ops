---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-external-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-external-api
    creationPolicy: Owner
    template:
      data:
        POCKET_ID_API_KEY: "{{ .POCKET_ID_API_KEY }}"
  dataFrom:
    - extract:
        key: pocket-id
