---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  chartRef:
    kind: OCIRepository
    name: unpackerr
  interval: 1h
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: golift/unpackerr
              tag: 0.15.2
            env:
              TZ: Australia/Sydney
              UN_DEBUG: false
              UN_QUIET: false
              UN_ACTIVITY: true
              UN_INTERVAL: 2m
              UN_PROGRESS: 15s
              UN_START_DELAY: 1m
              UN_RETRY_DELAY: 5m
              UN_MAX_RETRIES: 3
              UN_PARALLEL: 1
              UN_FILE_MODE: "0644"
              UN_DIR_MODE: "0755"
              UN_WEBSERVER_METRICS: true
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &metrics-port 5656
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          metrics:
            port: *metrics-port
    persistence:
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/downloads
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
