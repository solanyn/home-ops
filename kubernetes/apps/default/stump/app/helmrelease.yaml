---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stump
spec:
  chartRef:
    kind: OCIRepository
    name: stump
  interval: 1h
  values:
    controllers:
      stump:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/aaronleopold/stump
              tag: 0.1.14@sha256:3f9ab90b52200b614df2fa14696f1c1e8cb036db8c33998559f0dabdfcdb8230
            env:
              TZ: Australia/Sydney
              PUID: &puid "1000"
              PGID: &pgid "1000"
              STUMP_CONFIG_DIR: /config
              STUMP_PORT: &port 10801
              # Stump builds the OIDC redirect from the request host, so behind
              # the gateway it would otherwise derive an internal name. These
              # mirror the PocketID client registered in oidc.yaml.
              STUMP_OIDC_ENABLED: "true"
              STUMP_OIDC_CLIENT_ID: stump
              STUMP_OIDC_ISSUER_URL: https://id.goyangi.io
              STUMP_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: stump-oidc
                    key: client-secret
              STUMP_OIDC_ALLOW_REGISTRATION: "true"
              STUMP_TRUST_PROXY_HEADERS: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              # The image's entrypoint remaps the built-in user to PUID/PGID with
              # adduser/usermod, chowns /app and /config, then drops to that user.
              # Those steps need root plus exactly these capabilities; the app
              # process itself runs as uid 1000 so it can read the NFS library.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.goyangi.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      # Stump keeps all state in /config; the library is only scanned, so mount
      # it read-only. The three type directories are split so each becomes a
      # distinct Stump library instead of one undifferentiated tree.
      manga:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/library/manga
        globalMounts:
          - path: /data/manga
            readOnly: true
      manhwa:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/library/manhwa
        globalMounts:
          - path: /data/manhwa
            readOnly: true
      manhua:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/library/manhua
        globalMounts:
          - path: /data/manhua
            readOnly: true
