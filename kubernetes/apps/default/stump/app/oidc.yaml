---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: stump
spec:
  clientID: stump
  callbackUrls:
    - https://stump.goyangi.io/api/v2/auth/oidc/callback
  logoutCallbackUrls:
    - https://stump.goyangi.io
  allowedUserGroups:
    - name: user
  secret:
    name: stump-oidc
    keys:
      clientSecret: client-secret
