---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kan
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: storage
    - name: pocket-id-resources
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/kan/app
  postBuild:
    substitute:
      APP: kan
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
