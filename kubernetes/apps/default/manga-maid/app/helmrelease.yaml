---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manga-maid
spec:
  chartRef:
    kind: OCIRepository
    name: manga-maid
  interval: 10m
  values:
    controllers:
      manga-maid:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pullaf/manga-maid
              tag: 2.3@sha256:297128b374a8b77d824ced036f77b2e27a9049fc191ad8ebaab114e50037e225
            env:
              TZ: Australia/Sydney
              PUID: "1000"
              PGID: "1000"
              DATA_DIR: /data
              MANGA_ROOT: /manga
              CONFIG_PATH: /seed/settings.json
              TELEMETRY: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4649
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 640Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.goyangi.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      seed:
        type: configMap
        name: manga-maid-seed
        globalMounts:
          - path: /seed
            readOnly: true
      manga:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/library/manga-maid-staging
        globalMounts:
          - path: /manga
    configMaps:
      seed:
        data:
          settings.json: |
            {
              "root_folders": ["Bleach"],
              "sync_cron": "disabled",
              "auto_scan": false,
              "auto_covers": false,
              "telemetry_enabled": false,
              "suwayomi_url": "http://suwayomi.default.svc.cluster.local:4567",
              "kavita_url": "",
              "kavita_api_key": "",
              "enabled_sources": []
            }
