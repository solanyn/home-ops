---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamarr
spec:
  chartRef:
    kind: OCIRepository
    name: gamarr
  interval: 1h
  values:
    controllers:
      gamarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gamarr-app/gamarr
              tag: 1.0.1
            command:
              - /app/gamarr/bin/Gamarr
            args:
              - -nobrowser
              - -data=/config
            env:
              TMPDIR: /tmp
              QB_URL: "http://qbittorrent.default.svc.cluster.local"
              QB_USER: "andrew"
              TZ: "Australia/Sydney"
            envFrom:
              - secretRef:
                  name: gamarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 6767
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 6767
    route:
      app:
        hostnames:
          - "gamarr.goyangi.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          gamarr:
            app:
              - path: /config
                subPath: gamarr
      incoming:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          gamarr:
            app:
              - path: /data/incoming
                subPath: incoming
      roms:
        type: nfs
        server: nas.internal
        path: /mnt/world/media/games/roms
        advancedMounts:
          gamarr:
            app:
              - path: /data/roms
      tmp:
        type: emptyDir
