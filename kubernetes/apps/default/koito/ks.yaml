---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: koito
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/default/koito/app
  postBuild:
    substitute:
      APP: koito
      KOPIUR_CAPACITY: 2Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
