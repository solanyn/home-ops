---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: opencloud-web
spec:
  clientID: web
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - https://opencloud.goyangi.io/oidc-callback.html
  logoutCallbackUrls:
    - https://opencloud.goyangi.io
  allowedUserGroups:
    - name: user
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: opencloud-android
spec:
  clientID: OpenCloudAndroid
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - oc://android.opencloud.eu
  logoutCallbackUrls:
    - oc://android.opencloud.eu
  allowedUserGroups:
    - name: user
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: opencloud-ios
spec:
  clientID: OpenCloudIOS
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - oc://ios.opencloud.eu
  logoutCallbackUrls:
    - oc://ios.opencloud.eu
  allowedUserGroups:
    - name: user
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: opencloud-desktop
spec:
  clientID: OpenCloudDesktop
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - http://127.0.0.1
  logoutCallbackUrls:
    - http://127.0.0.1
  allowedUserGroups:
    - name: user
