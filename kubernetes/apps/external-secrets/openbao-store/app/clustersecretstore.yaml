---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.goyangi.io
      path: kv
      version: v2
      auth:
        # OpenBao validates the projected service-account token against a
        # static copy of this cluster's SA signing keys (see
        # docker/edge/06-openbao/scripts/eso-jwt.py), so there is no bootstrap
        # secret in the cluster and no callback from OpenBao to the API server.
        # Re-run that script with fresh `kubectl get --raw /openid/v1/jwks` if
        # the SA signing key ever rotates.
        jwt:
          path: jwt
          role: goyangi-eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences: ["openbao"]
            expirationSeconds: 600
