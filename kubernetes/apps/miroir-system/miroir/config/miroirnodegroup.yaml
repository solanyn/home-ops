---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/miroir.home-operations.com/miroirnodegroup_v1alpha1.json
apiVersion: miroir.home-operations.com/v1alpha1
kind: MiroirNodeGroup
metadata:
  name: default
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  template:
    pools:
      - name: default
        lvmthin:
          device: /dev/disk/by-path/pci-0000:01:00.0-nvme-1
