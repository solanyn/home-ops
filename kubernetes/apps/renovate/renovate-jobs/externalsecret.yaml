---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-github-bot
    creationPolicy: Owner
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .GITHUB_BOT_APP_ID }}"
        INSTALL_ID: "{{ .GITHUB_BOT_INSTALLATION_ID }}"
        PEM: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-bot
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-forgejo
    creationPolicy: Owner
    template:
      data:
        FORGEJO_TOKEN: "{{ .FORGEJO_TOKEN }}"
  dataFrom:
    - extract:
        key: forgejo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-ocharted
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-ocharted
    creationPolicy: Owner
    template:
      data:
        OCHARTED_USERNAME: "{{ .OCHARTED_USERNAME }}"
        OCHARTED_PASSWORD: "{{ .OCHARTED_PASSWORD }}"
  dataFrom:
    - extract:
        key: ocharted
