---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: solanyn
spec:
  discoveryFilters: ["solanyn/*"]
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |-
        ["pnpm run bundle", "^mise install && mise lock$"]
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: |-
        ["mise"]
    - name: RENOVATE_PLATFORM_COMMIT_ENABLED
      value: "true"
    - name: OCHARTED_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-ocharted
          key: OCHARTED_USERNAME
    - name: OCHARTED_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-ocharted
          key: OCHARTED_PASSWORD
    - name: RENOVATE_HOST_RULES
      value: >-
        [
          {
            "hostType": "docker",
            "matchHost": "ocharted.goyangi.io",
            "username": "$(OCHARTED_USERNAME)",
            "password": "$(OCHARTED_PASSWORD)"
          }
        ]
  image: ghcr.io/renovatebot/renovate:44.57.2
  parallelism: 5
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 20 * * * *
  secretRef: renovate-github-auth-token

  webhook:
    enabled: true
    authentication:
      enabled: false
---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  discoveryFilters:
    - andrew/nix-darwin
  skipForks: true
  secretRef: renovate-forgejo
  provider:
    name: forgejo
    endpoint: https://forgejo.goyangi.io
    publicEndpoint: https://forgejo.goyangi.io
  image: ghcr.io/renovatebot/renovate:44.57.2
  parallelism: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 40 * * * *
