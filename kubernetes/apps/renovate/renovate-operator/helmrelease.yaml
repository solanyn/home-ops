---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 15m
  values:
    fullnameOverride: renovate-operator
    route:
      enabled: true
      hostnames:
        - renovate.goyangi.io
      parentRefs:
        - name: envoy-internal
          namespace: network
    webhook:
      enabled: true
    policy:
      enabled: true
      allowedImages:
        - renovate/renovate
        - docker.io/renovate/renovate
        - ghcr.io/renovatebot/renovate
    rbac:
      ownNamespaceOnly: true
