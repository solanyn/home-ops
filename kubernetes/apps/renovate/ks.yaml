---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
spec:
  targetNamespace: renovate
  interval: 1h
  path: ./kubernetes/apps/renovate/renovate-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-jobs
spec:
  targetNamespace: renovate
  dependsOn:
    - name: renovate-operator
      namespace: renovate
  interval: 1h
  path: ./kubernetes/apps/renovate/renovate-jobs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
