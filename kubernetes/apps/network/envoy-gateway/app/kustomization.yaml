---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./block-user-agents.yaml
  - ./eep.yaml
  - ./envoy.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./observability.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: envoy-external-extensions
    files:
      - block-user-agents.lua=./resources/block-user-agents.lua
generatorOptions:
  disableNameSuffixHash: true
