---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-operator
  namespace: auth
spec:
  targetNamespace: auth
  interval: 1h
  path: ./kubernetes/apps/auth/kanidm-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-instance
  namespace: auth
spec:
  targetNamespace: auth
  dependsOn:
    - name: kanidm-operator
      namespace: auth
  interval: 1h
  path: ./kubernetes/apps/auth/kanidm-operator/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
