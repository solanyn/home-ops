---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        uri: "postgresql://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@kritika-postgres-rw.ai.svc.cluster.local/kritika?sslmode=require&connect_timeout=10"
  data:
    - secretKey: KRITIKA_POSTGRES_OWNER_PASSWORD
      remoteRef:
        key: kritika
        property: KRITIKA_POSTGRES_OWNER_PASSWORD
---
