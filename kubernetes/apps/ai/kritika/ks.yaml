---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-database
  namespace: ai
spec:
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: kritika-postgres
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/kritika/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika
  namespace: ai
spec:
  dependsOn:
    - name: kritika-database
      namespace: ai
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kritika
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/kritika/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
