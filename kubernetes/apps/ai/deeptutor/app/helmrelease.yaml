---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deeptutor
spec:
  chartRef:
    kind: OCIRepository
    name: deeptutor
  interval: 1h
  values:
    controllers:
      deeptutor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hkuds/deeptutor
              tag: 1.7.4@sha256:368dac975e38956f46fe26e5e594a4420e43ca676293f0e9f347232742c18947
            env:
              TZ: Australia/Sydney
              PUID: &puid "1000"
              PGID: &pgid "1000"
              # Content workspace lives on the Kopiur volume so uploads and
              # generated files are backed up with the app's own state.
              DEEPTUTOR_WORKSPACE_ROOT: &workspace /data/workspace
              DEEPTUTOR_WORKSPACE_ALLOWED_ROOTS: *workspace
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3782
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              # The entrypoint remaps the built-in deeptutor user to PUID/PGID,
              # chowns /app/data, then starts supervisord; both child processes
              # drop to uid 1000. Those setup steps need root plus exactly these.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.goyangi.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
