---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: litellm-operator
spec:
    chartRef:
        kind: OCIRepository
        name: litellm-operator
    interval: 1h
    values:
        resources:
            requests:
                cpu: 25m
                memory: 128Mi
            limits:
                memory: 512Mi
