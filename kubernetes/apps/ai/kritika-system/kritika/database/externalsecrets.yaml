---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        uri: "postgres://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@kritika-postgres-rw.kritika-system.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
