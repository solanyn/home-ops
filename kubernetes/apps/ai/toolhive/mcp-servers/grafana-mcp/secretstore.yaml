---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: o11y-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: o11y
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: grafana-mcp-sa
