---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana-mcp
  namespace: ai
spec:
  image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --transport
            - streamable-http
            - --allowed-hosts
            - "*"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.o11y.svc:3000
  secrets:
    - name: grafana-sa-token
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  groupRef:
    name: mcp-tools
