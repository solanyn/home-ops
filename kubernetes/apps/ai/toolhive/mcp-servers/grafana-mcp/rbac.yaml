---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-token-reader
  namespace: o11y
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-sa-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-token-reader
  namespace: o11y
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-sa-token-reader
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-sa
    namespace: ai
