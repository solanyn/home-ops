---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-token-reader
  namespace: o11y
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-token-reader
  namespace: o11y
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-sa-token-reader
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-sa
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-sa-token-selfsubjectrulesreview
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sa-token-selfsubjectrulesreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-sa-token-selfsubjectrulesreview
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-sa
    namespace: ai
