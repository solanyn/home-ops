---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-sa-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-sa-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sa-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-sa-token-reader
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-sa
    namespace: ai
