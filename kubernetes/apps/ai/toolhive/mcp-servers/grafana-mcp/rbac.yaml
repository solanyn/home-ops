---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-sa-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-sa-token"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sa-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-sa-token-reader
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-sa
    namespace: ai
