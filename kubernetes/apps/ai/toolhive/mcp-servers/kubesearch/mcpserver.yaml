---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
  namespace: ai
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:latest@sha256:e5613e0824cf4446fb64e9e3210513c173e7201d36161272b71455341302fc3d
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    - name: KUBESEARCH_ENABLE_CLONE
      value: "true"
  podTemplateSpec:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubesearch
  groupRef:
    name: mcp-tools
