apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openclaw
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        PAPERLESS_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
        OP_SERVICE_ACCOUNT_TOKEN: "{{ .OP_SERVICE_ACCOUNT_TOKEN }}"
        FORGEJO_TOKEN: "{{ .FORGEJO_TOKEN }}"
        INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN }}"
        MATRIX_BOT_ACCESS_TOKEN: "{{ .MATRIX_BOT_ACCESS_TOKEN }}"
        BLUEBUBBLES_PASSWORD: "{{ .BLUEBUBBLES_PASSWORD }}"
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: litellm
    - extract:
        key: memini
    - extract:
        key: paperless
    - extract:
        key: 1password
    - extract:
        key: forgejo
    - extract:
        key: influxdb
    - extract:
        key: matrix
    - extract:
        key: bluebubbles
