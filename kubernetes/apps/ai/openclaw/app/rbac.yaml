apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-hermes-inspector
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-hermes-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-hermes-inspector
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: ai
