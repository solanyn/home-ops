apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      plugins: {
        slots: { memory: "memini" },
        entries: {
          memini: {
            enabled: true,
            hooks: { allowConversationAccess: true },
            config: {
              base_url: "http://memini.ai.svc.cluster.local:8080",
              namespace: "openclaw",
              namespace_per_agent: true,
              namespace_template: "{namespace}-{agent}",
              fallback_on_error: true,
              timeout_ms: 30000,
              expose_tools: true
            },
            tools: { allow: ["memory_recall", "memory_list", "memory_remember", "memory_forget"] }
          }
        }
      },
      agents: {
        defaults: {
          model: {
            primary: "litellm/reasoning-pool",
            fallbacks: ["litellm/frontier-pool"]
          },
          timeoutSeconds: 1800,
          thinkingDefault: "high"
        },
        entries: {
          main: {
            default: true,
            name: "OpenClaw",
            workspace: "/home/node/.openclaw/workspace-main",
            agentDir: "/home/node/.openclaw/agents/main/agent"
          }
        }
      },
      models: {
        providers: {
          litellm: {
            baseUrl: "http://litellm.ai.svc.cluster.local:4000/v1",
            apiKey: "$${LITELLM_API_KEY}",
            api: "openai-completions",
            timeoutSeconds: 1800,
            models: [
              { id: "reasoning-pool", name: "Reasoning pool", reasoning: true, input: ["text", "image"], contextWindow: 1000000, maxTokens: 131072 },
              { id: "frontier-pool", name: "Frontier pool", reasoning: true, input: ["text", "image"], contextWindow: 1000000, maxTokens: 131072 }
            ]
          }
        }
      },
      gateway: {
        auth: { mode: "token", token: "$${OPENCLAW_GATEWAY_TOKEN}" },
        controlUi: { allowedOrigins: ["https://openclaw.goyangi.io"] },
        mode: "local",
        bind: "lan",
        port: 18789,
        publicOrigin: "https://openclaw.goyangi.io",
        trustedProxies: ["10.42.0.0/16"],
        allowRealIpFallback: true
      },
      mcp: {
        servers: {
          toolhive: {
            url: "http://vmcp-mcp-gateway.ai.svc.cluster.local:4483/mcp",
            transport: "streamable-http",
            headers: { Accept: "application/json, text/event-stream" }
          }
        }
      },
    }
