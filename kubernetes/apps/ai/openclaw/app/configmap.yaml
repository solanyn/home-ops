apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      plugins: {
        allow: ["memini"],
        slots: { memory: "memini" },
        entries: {
          memini: {
            enabled: true,
            hooks: { allowConversationAccess: true },
            config: {
              base_url: "http://memini.ai.svc.cluster.local:8080",
              namespace: "openclaw",
              namespace_per_agent: true,
              namespace_template: "{namespace}/{agent}",
              skip_without_agent: true,
              skip_system_turns: true,
              fallback_on_error: true,
              timeout_ms: 60000,
              recall_limit: 3,
              min_capture_chars: 24,
              recall_position: "append",
              expose_tools: true
            }
          }
        }
      },
      agents: {
        defaults: {
          model: {
            primary: "litellm/reasoning-pool",
            fallbacks: ["litellm/frontier-pool"]
          },
          timeoutSeconds: 1800,
          thinkingDefault: "high",
          contextPruning: {
            mode: "cache-ttl",
            ttl: "1h",
            tools: {
              allow: [],
              deny: []
            },
            hardClear: {
              enabled: true,
              placeholder: "[Old tool result content cleared]"
            }
          }
        },
        entries: {
          main: {
            default: true,
            name: "Hawow",
            workspace: "/home/node/.openclaw/workspace",
            agentDir: "/home/node/.openclaw/agents/main/agent",
            tools: { alsoAllow: ["memory_recall", "memory_list", "memory_remember", "memory_forget", "sessions_spawn"] },
          },
          pulse: {
            name: "Pulse",
            workspace: "/home/node/.openclaw/workspace-pulse",
            agentDir: "/home/node/.openclaw/agents/pulse/agent",
            tools: { allow: ["read", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember"] },
          },
          counsel: {
            name: "Counsel",
            workspace: "/home/node/.openclaw/workspace-counsel",
            agentDir: "/home/node/.openclaw/agents/counsel/agent",
            tools: { allow: ["read", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember"] },
          },
          tinker: {
            name: "Tinker",
            workspace: "/home/node/.openclaw/workspace-tinker",
            agentDir: "/home/node/.openclaw/agents/tinker/agent",
            tools: { allow: ["read", "write", "edit", "exec", "process", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember", "sessions_spawn"] },
          },
          nexus: {
            name: "Nexus",
            workspace: "/home/node/.openclaw/workspace-nexus",
            agentDir: "/home/node/.openclaw/agents/nexus/agent",
            tools: { allow: ["read", "write", "edit", "exec", "process", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember", "sessions_spawn"] },
          },
          quest: {
            name: "Quest",
            workspace: "/home/node/.openclaw/workspace-quest",
            agentDir: "/home/node/.openclaw/agents/quest/agent",
            tools: { allow: ["read", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember"] },
          },
          lore: {
            name: "Lore",
            workspace: "/home/node/.openclaw/workspace-lore",
            agentDir: "/home/node/.openclaw/agents/lore/agent",
            tools: { allow: ["read", "write", "edit", "web_search", "web_fetch", "memory_recall", "memory_list", "memory_remember"] },
          }
        }
      },
      models: {
        providers: {
          litellm: {
            baseUrl: "http://litellm.ai.svc.cluster.local:4000/v1",
            apiKey: "$${LIT…_KEY}",
            api: "openai-completions",
            timeoutSeconds: 1800,
            models: [
              { id: "reasoning-pool", name: "Reasoning pool", reasoning: true, input: ["text", "image"], contextWindow: 1000000, maxTokens: 131072 },
              { id: "frontier-pool", name: "Frontier pool", reasoning: true, input: ["text", "image"], contextWindow: 1000000, maxTokens: 131072 }
            ]
          }
        }
      },
      gateway: {
        auth: { mode: "token", token: "$${OPENCLAW_GATEWAY_TOKEN}" },
        controlUi: { allowedOrigins: ["https://openclaw.goyangi.io"] },
        mode: "local",
        bind: "lan",
        port: 18789,
        publicOrigin: "https://openclaw.goyangi.io",
        // OpenClaw 2026.9.7 matches trusted proxies by exact peer address.
        // Keep these in sync with the Envoy-internal gateway pods so forwarded
        // client attribution works through the HTTPS/WebSocket route.
        trustedProxies: ["10.42.1.185", "10.42.2.84"],
        allowRealIpFallback: true
      },
      mcp: {
        servers: {
          toolhive: {
            url: "http://vmcp-mcp-gateway.ai.svc.cluster.local:4483/mcp",
            transport: "streamable-http",
            headers: { Accept: "application/json, text/event-stream" }
          }
        }
      },
    }
