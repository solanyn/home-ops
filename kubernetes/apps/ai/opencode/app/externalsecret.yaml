---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  dataFrom:
    - extract:
        key: 1password
    - extract:
        key: opencode
    - extract:
        key: bluebubbles
    - extract:
        key: honcho
    - extract:
        key: litellm
    - extract:
        key: matrix
    - extract:
        key: forgejo
    - extract:
        key: influxdb
    - extract:
        key: hermes
  target:
    name: opencode
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        OPENCODE_SERVER_PASSWORD: "{{ .OPENCODE_SERVER_PASSWORD }}"
