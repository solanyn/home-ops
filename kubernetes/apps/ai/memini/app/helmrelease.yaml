apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: memini
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: openclaw
              MEMINI_EMBED_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: qwen3-embedding
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: 32
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: cron-pool
              MEMINI_LLM_MAX_TOKENS: "24576"
              MEMINI_DISTILL_TIMEOUT: 600s
              MEMINI_RECALL_EMBED_TIMEOUT: 15s
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              MEMINI_DISTILL_ON_WRITE: "false"
              MEMINI_TIMEOUT_MS: "30000"
            envFrom:
              - secretRef:
                  name: memini
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      api-keys:
        enabled: true
        globalMounts:
          - path: /etc/memini/api-keys.yaml
            subPath: api-keys.yaml
    service:
      main:
        ports:
          http:
            port: 8080
