apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MEMINI_EMBED_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_LLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: memini
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-api-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-keys.yaml: |
          keys:
            - name: openclaw
              secret: "{{ .MEMINI_API_KEY }}"
              default_namespace: openclaw
  dataFrom:
    - extract:
        key: memini
