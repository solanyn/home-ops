---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  targetNamespace: ai
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: hermes
      VOLSYNC_CAPACITY: 10Gi
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      BREW_PREFIX: /opt/data/homebrew/.linuxbrew
      BREW_USER_HOME: /opt/data/homebrew/.homebrew-user
      # These are bash variables in the install-tools init script.
      # Flux's envsubst (strict mode) fails on any unset $VAR, so we
      # provide their literal values — substitution is transparent.
      HOMEBREW_PREFIX: /opt/data/homebrew/.linuxbrew
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
