---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  targetNamespace: ai
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
