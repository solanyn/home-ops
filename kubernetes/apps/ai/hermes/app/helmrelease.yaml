# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 10m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      hermes:
        enabled: true
        annotations:
          reloader.stakater.com/match: "true"
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                mkdir -p /opt/data/.codex
                chown -R 10000:10000 /opt/data/.codex

                # .config/op may be owned by a stale UID from a restored snapshot;
                # op refuses to read a config owned by another user. Fix ownership
                # here as root so the app (runAsUser 10000) can use the CLI.
                chown -R 10000:10000 /opt/data/.config 2>/dev/null || true
          install-tools:
            image:
              repository: docker.io/library/debian
              tag: "13-slim"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq curl ca-certificates git build-essential file unzip util-linux patch bzip2 nodejs npm >/dev/null 2>&1

                # linuxbrew refuses to run as root and needs a writable $HOME.
                # Install at /opt/data/homebrew/.linuxbrew (PVC-backed, persists across pod restarts)
                # and use /opt/data/homebrew/.homebrew-user as the non-root $HOME.
                BREW_PREFIX="/opt/data/homebrew/.linuxbrew"
                BREW_USER_HOME="/opt/data/homebrew/.homebrew-user"
                mkdir -p "$BREW_PREFIX" "$BREW_USER_HOME"
                chown -R 10000:10000 "$BREW_PREFIX" "$BREW_USER_HOME"

                # brew casks require a passwd entry for the running UID.
                # Inject a synthetic entry for UID 10000 so 'op' cask can install.
                if ! getent passwd 10000 >/dev/null; then
                  echo "brewuser:x:10000:10000:brewuser:${BREW_USER_HOME}:/bin/bash" >> /etc/passwd
                fi

                setpriv --reuid=10000 --regid=10000 --clear-groups env \
                  HOME="$BREW_USER_HOME" \
                  HOMEBREW_PREFIX="$BREW_PREFIX" \
                  HOMEBREW_NO_ANALYTICS=1 \
                  HOMEBREW_NO_AUTO_UPDATE=1 \
                  NONINTERACTIVE=1 \
                  PATH="/opt/data/homebrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
                  bash -c '
                    set -euo pipefail

                    # The upstream install.sh ignores HOMEBREW_PREFIX on Linux and
                    # always tries to write to /home/linuxbrew/.linuxbrew via sudo.
                    # Bootstrap manually from the official brew tarball instead.
                    if [[ ! -x "$HOMEBREW_PREFIX/Homebrew/bin/brew" ]]; then
                      echo "[install-tools] Bootstrapping linuxbrew at $HOMEBREW_PREFIX (cold)..."
                      cd "$HOMEBREW_PREFIX"
                      curl -fsSL https://github.com/Homebrew/brew/tarball/main -o brew.tgz
                      mkdir -p Homebrew
                      tar -xzf brew.tgz -C Homebrew --strip-components 1
                      rm brew.tgz
                      mkdir -p bin
                      ln -sf ../Homebrew/bin/brew bin/brew
                    else
                      echo "[install-tools] linuxbrew already installed (warm cache hit)"
                    fi

                    eval "$("$HOMEBREW_PREFIX/bin/brew" shellenv)"

                    # brew 4.x refuses to load formulae from untrusted taps.
                    brew trust fluxcd/tap 2>/dev/null || true

                    # Declarative toolset lives in /tmp/Brewfile (mounted from the
                    # hermes-config ConfigMap). --no-upgrade keeps the init
                    # deterministic; version bumps land as follow-up commits.
                    brew bundle install --no-upgrade --file=/tmp/Brewfile

                    # Ensure op CLI config has restricted permissions
                    mkdir -p /opt/data/.config/op
                    chmod 700 /opt/data/.config/op || true
                    if [ -f /opt/data/.config/op/config ]; then
                        chmod 600 /opt/data/.config/op/config || true
                    fi

                    # Stage a pinned Codex CLI in the PVC-backed tool directory.
                    # Hermes launches codex app-server as its child process.
                    CODEX_PREFIX="/opt/data/codex"
                    mkdir -p "$CODEX_PREFIX"
                    export PATH="$HOMEBREW_PREFIX/bin:$CODEX_PREFIX/bin:$PATH"
                    npm install --global --prefix "$CODEX_PREFIX" --no-update-notifier --no-fund \
                      @openai/codex@0.130.0
                    "$CODEX_PREFIX/bin/codex" --version
                    "$CODEX_PREFIX/bin/codex" app-server --help >/dev/null
                  '

                chmod -R a+rx "$BREW_PREFIX/bin"

                echo "[install-tools] Available binaries:"
                ls -la "$BREW_PREFIX/bin"
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.8.18@sha256:22e37bb4ed1b0f50cb6bd991dca7ecacd6c9f29df9b4a20fc989d32bc763ccf6
            command: ["/opt/hermes/bin/hermes"]
            args: ["gateway", "run"]
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
              PATH: /opt/data/homebrew/.linuxbrew/bin:/opt/data/homebrew/.linuxbrew/sbin:/opt/data/codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              CODEX_HOME: /opt/data/.codex
              HOMEBREW_PREFIX: /opt/data/homebrew/.linuxbrew
              HOMEBREW_CELLAR: /opt/data/homebrew/.linuxbrew/Cellar
              HOMEBREW_NO_ANALYTICS: "1"
              HOMEBREW_NO_AUTO_UPDATE: "1"
              TZ: Australia/Sydney
              API_SERVER_ENABLED: "true"
              API_SERVER_KEY: CFE1B842-AEF8-4704-A51D-1E885A5C7967
              HONCHO_WORKSPACE_ID: "hermes"
              BLUEBUBBLES_SERVER_URL: http://bluebubbles.internal:1234
              BLUEBUBBLES_WEBHOOK_HOST: 0.0.0.0
              BLUEBUBBLES_WEBHOOK_PORT: "8645"
              BLUEBUBBLES_WEBHOOK_PATH: /bluebubbles-webhook
              BLUEBUBBLES_REQUIRE_MENTION: "true"
              MATRIX_HOMESERVER: https://matrix.goyangi.io
              MATRIX_USER_ID: "@hawow:goyangi.io"
              MATRIX_ALLOWED_USERS: "@andrew:goyangi.io"
              MATRIX_E2EE_MODE: required
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          dashboard:
            image: *image
            env:
              GATEWAY_HEALTH_URL: http://localhost:8642
              TZ: Australia/Sydney
            command: ["/opt/hermes/bin/hermes"]
            args:
              - dashboard
              - --host
              - 0.0.0.0
              - --insecure
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              limits:
                memory: 512Mi
          serve:
            image: *image
            command: ["/opt/hermes/bin/hermes"]
            args:
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "9120"
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
              PATH: /opt/data/homebrew/.linuxbrew/bin:/opt/data/homebrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              HOMEBREW_PREFIX: /opt/data/homebrew/.linuxbrew
              HOMEBREW_CELLAR: /opt/data/homebrew/.linuxbrew/Cellar
              HOMEBREW_NO_ANALYTICS: "1"
              HOMEBREW_NO_AUTO_UPDATE: "1"
              TZ: Australia/Sydney
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-serve
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-serve.goyangi.io
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 8642
      dashboard:
        controller: hermes
        ports:
          http:
            port: 9119
      webhook:
        controller: hermes
        ports:
          http:
            port: 8645
      serve:
        controller: hermes
        ports:
          http:
            port: 9120
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      home-cache:
        type: emptyDir
        globalMounts:
          - path: /opt/data/home/.cache
      npm-cache:
        type: emptyDir
        globalMounts:
          - path: /opt/data/.npm
      runtime-cache:
        type: emptyDir
        globalMounts:
          - path: /opt/data/.cache
          - path: /opt/data/homebrew/.homebrew-user/.cache
      codex:
        type: emptyDir
        globalMounts:
          - path: /opt/data/codex
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
            readOnly: true
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
          - path: /tmp/Brewfile
            subPath: Brewfile
          - path: /tmp/hermes-matrix-timeout.patch
            subPath: hermes-matrix-timeout.patch
