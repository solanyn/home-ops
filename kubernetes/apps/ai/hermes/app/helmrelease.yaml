# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 10m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      hermes:
        enabled: true
        annotations:
          reloader.stakater.com/match: "true"
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml

                umask 077
                printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > /opt/data/.env
                # Profile-local env files are required for child workers to
                # resolve the shared LiteLLM credential.
                for profile in /opt/data/profiles/*; do
                  if [ -d "$profile" ]; then
                    tmp="$profile/.env.tmp"
                    { grep -v '^OPENAI_API_KEY=' "$profile/.env" 2>/dev/null || true; \
                      printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"; } > "$tmp"
                    chown 10000:10000 "$tmp"
                    chmod 600 "$tmp"
                    mv "$tmp" "$profile/.env"
                  fi
                done

                # .config/op may be owned by a stale UID from a restored snapshot;
                # op refuses to read a config owned by another user. Fix ownership
                # here as root so the app (runAsUser 10000) can use the CLI.
                chown -R 10000:10000 /opt/data/.config 2>/dev/null || true

                # fsGroup relaxes the ssh key mode at mount time and openssh
                # refuses a group-readable private key; restore it after mount.
                chmod 600 /opt/data/.ssh/id_ed25519 2>/dev/null || true

                # fsGroup also broadens the op config dir to 2770 and op refuses
                # a group-readable config path; its daemon needs a writable
                # XDG_RUNTIME_DIR, which the image points at a root-owned dir.
                for d in /opt/data/.config/op /opt/data/home/.config/op; do
                  if [ -d "$d" ]; then
                    chmod 700 "$d"
                    find "$d" -type f -exec chmod 600 {} + 2>/dev/null || true
                  fi
                done
                # /tmp and /run are emptyDir volumes, so the image's baked-in
                # /tmp/hermes-runtime is shadowed by the fresh mount; recreate it
                # for op's daemon, which needs a writable XDG_RUNTIME_DIR.
                mkdir -p /tmp/hermes-runtime
                chown 10000:10000 /tmp/hermes-runtime
                chmod 700 /tmp/hermes-runtime
            envFrom:
              - secretRef:
                  name: hermes
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            args: ["gateway", "run"]
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              # s6-overlay refuses a non-world-writable /run on Kubernetes, where
              # the projected/emptyDir mount cannot be chmod'd; this is the
              # supported opt-out and the image's own documented k8s path.
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # Point the Honcho memory provider at the in-cluster instance.
              # Without this the plugin resolves base_url=None and falls back to
              # environment=production (Honcho cloud), silently ignoring the
              # self-hosted server. NB the key is NOT HONCHO_URL and does not
              # live under memory: in config.yaml — the plugin reads
              # HONCHO_BASE_URL (or honcho.json), nothing else.
              HONCHO_BASE_URL: http://honcho.ai.svc.cluster.local
              MATRIX_ALLOWED_USERS: "@andrew:goyangi.io"
              MATRIX_ALLOW_ROOM_MENTIONS: "false"
              MATRIX_AUTO_THREAD: "true"
              MATRIX_ENCRYPTION: "true"
              MATRIX_FREE_RESPONSE_ROOMS: "!12_EWTBUFG6QBq_b-KblbBRCVqf8ijvRJqIo-T58tP4"
              MATRIX_HOME_ROOM: "!12_EWTBUFG6QBq_b-KblbBRCVqf8ijvRJqIo-T58tP4"
              MATRIX_PROCESS_NOTICES: "false"
              MATRIX_REQUIRE_MENTION: "false"
              MATRIX_SESSION_SCOPE: thread
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Australia/Sydney
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              BLUEBUBBLES_SERVER_URL: http://bluebubbles.internal:1234
              BLUEBUBBLES_WEBHOOK_HOST: 0.0.0.0
              BLUEBUBBLES_WEBHOOK_PORT: "8645"
              BLUEBUBBLES_WEBHOOK_PATH: /bluebubbles-webhook
              BLUEBUBBLES_REQUIRE_MENTION: "true"
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              # app runs ~770Mi live; keep the limit generous so page-cache
              # pressure from state.db / kanban workspaces cannot OOMKill it.
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
          dashboard:
            image: *image
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              GATEWAY_HEALTH_URL: http://localhost:8642
              TZ: Australia/Sydney
            command: ["/opt/hermes/bin/hermes"]
            args:
              - dashboard
              - --host
              - 0.0.0.0
              - --insecure
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          serve:
            image: *image
            command: ["/opt/hermes/bin/hermes"]
            args:
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "9120"
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Australia/Sydney
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-serve
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-serve.goyangi.io
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 8642
      dashboard:
        controller: hermes
        ports:
          http:
            port: 9119
      webhook:
        controller: hermes
        ports:
          http:
            port: 8645
      serve:
        controller: hermes
        ports:
          http:
            port: 9120
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
            readOnly: true
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      run:
        type: emptyDir
        globalMounts:
          - path: /run
