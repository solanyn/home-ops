# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 10m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      hermes:
        enabled: true
        annotations:
          reloader.stakater.com/match: "true"
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml

                mkdir -p /opt/data/.codex
                chown -R 10000:10000 /opt/data/.codex

                # .config/op may be owned by a stale UID from a restored snapshot;
                # op refuses to read a config owned by another user. Fix ownership
                # here as root so the app (runAsUser 10000) can use the CLI.
                chown -R 10000:10000 /opt/data/.config 2>/dev/null || true
          install-codex:
            image:
              repository: docker.io/library/node
              tag: 22-bookworm-slim
            command:
              - sh
              - -c
              - |
                set -eu
                npm install --global --prefix /opt/tools/codex --no-update-notifier --no-fund \
                  @openai/codex@0.130.0
                /opt/tools/codex/bin/codex --version
                /opt/tools/codex/bin/codex app-server --help >/dev/null
                chmod -R a+rx /opt/tools/codex
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.9.21@sha256:6bece0644e29a347e5ae17db43c36938c86f171c6f5e0cef18aa2075d331f3a3
            command: ["/opt/hermes/bin/hermes"]
            args: ["gateway", "run"]
            env:
              PATH: /opt/tools/codex/bin:/usr/local/bin:/usr/bin:/bin
              HERMES_HOME: /opt/data
              HOME: /opt/data
              CODEX_HOME: /opt/data/.codex
              TZ: Australia/Sydney
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              HONCHO_WORKSPACE_ID: "hermes"
              BLUEBUBBLES_SERVER_URL: http://bluebubbles.internal:1234
              BLUEBUBBLES_WEBHOOK_HOST: 0.0.0.0
              BLUEBUBBLES_WEBHOOK_PORT: "8645"
              BLUEBUBBLES_WEBHOOK_PATH: /bluebubbles-webhook
              BLUEBUBBLES_REQUIRE_MENTION: "true"
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          dashboard:
            image: *image
            env:
              PATH: /opt/tools/codex/bin:/usr/local/bin:/usr/bin:/bin
              GATEWAY_HEALTH_URL: http://localhost:8642
              TZ: Australia/Sydney
            command: ["/opt/hermes/bin/hermes"]
            args:
              - dashboard
              - --host
              - 0.0.0.0
              - --insecure
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              limits:
                memory: 512Mi
          serve:
            image: *image
            command: ["/opt/hermes/bin/hermes"]
            args:
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "9120"
            env:
              PATH: /opt/tools/codex/bin:/usr/local/bin:/usr/bin:/bin
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Australia/Sydney
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-serve
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-serve.goyangi.io
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 8642
      dashboard:
        controller: hermes
        ports:
          http:
            port: 9119
      webhook:
        controller: hermes
        ports:
          http:
            port: 8645
      serve:
        controller: hermes
        ports:
          http:
            port: 9120
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
            readOnly: true
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      codex:
        type: emptyDir
        globalMounts:
          - path: /opt/tools/codex
