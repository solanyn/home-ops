# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 10m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, nodes, pods, pods/log, services, configmaps, events, persistentvolumeclaims, serviceaccounts, resourcequotas, limitranges, replicasets]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [pods, persistentvolumeclaims]
              verbs: [delete]
            - apiGroups: [apps]
              resources: [deployments, statefulsets, daemonsets]
              verbs: [get, list, watch]
            - apiGroups: [batch]
              resources: [jobs, cronjobs]
              verbs: [get, list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [ingresses, networkpolicies, gateways, gatewayclasses, httproutes, tlsroutes, grpcroutes]
              verbs: [get, list, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io, notification.toolkit.fluxcd.io, image.toolkit.fluxcd.io]
              resources: ["*"]
              verbs: [get, list, watch]
            - apiGroups: [kustomize.toolkit.fluxcd.io]
              resources: [kustomizations]
              verbs: [patch, update]
            - apiGroups: [external-secrets.io]
              resources: [clusterexternalsecrets, clustersecretstores]
              verbs: [get, list, watch]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
            - apiGroups: [policy]
              resources: [poddisruptionbudgets]
              verbs: [get, list, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses, volumeattachments, csidrivers, csinodes]
              verbs: [get, list, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates, certificaterequests, issuers, clusterissuers, orders, challenges]
              verbs: [get, list, watch]
        hermes-ai:
          type: Role
          namespace: ai
          rules:
            - apiGroups: [""]
              resources: [pods, pods/log, events, configmaps, secrets, services, endpoints, persistentvolumeclaims, serviceaccounts, resourcequotas, limitranges, replicasets]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, statefulsets, daemonsets]
              verbs: [get, list, watch]
            - apiGroups: [batch]
              resources: [jobs, cronjobs]
              verbs: [get, list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [ingresses, networkpolicies, gateways, httproutes, tlsroutes, grpcroutes]
              verbs: [get, list, watch]
            - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io, notification.toolkit.fluxcd.io, image.toolkit.fluxcd.io]
              resources: ["*"]
              verbs: [get, list, watch]
            - apiGroups: [external-secrets.io]
              resources: [externalsecrets, secretstores]
              verbs: [get, list, watch]
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-ai:
          type: RoleBinding
          namespace: ai
          roleRef:
            identifier: hermes-ai
          subjects:
            - identifier: hermes
              serviceAccount: hermes
    serviceAccount:
      hermes:
        enabled: true
        annotations:
          reloader.stakater.com/match: "true"
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml

                # .config/op may be owned by a stale UID from a restored snapshot;
                # op refuses to read a config owned by another user. Fix ownership
                # here as root so the app (runAsUser 10000) can use the CLI.
                chown -R 10000:10000 /opt/data/.config 2>/dev/null || true
          install-homelab-commit-watcher:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                skill_dir=/opt/data/skills/homelab/homelab-commit-watcher
                mkdir -p "$skill_dir"
                cp /run/skills/homelab-commit-watcher/SKILL.md "$skill_dir/SKILL.md"
                cp /run/skills/homelab-commit-watcher/fetch_k8s_repos.py "$skill_dir/fetch_k8s_repos.py"
                chmod 0755 "$skill_dir/fetch_k8s_repos.py"
          init-webui-agent:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                mkdir -p /webui-agent /opt/data/.hermes/webui
                cp -a /opt/hermes/. /webui-agent/
                chown -R 10000:10000 /opt/data/.hermes/webui
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command: ["/opt/hermes/bin/hermes"]
            args: ["gateway", "run"]
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Australia/Sydney
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              HONCHO_WORKSPACE_ID: "hermes"
              BLUEBUBBLES_SERVER_URL: http://bluebubbles.internal:1234
              BLUEBUBBLES_WEBHOOK_HOST: 0.0.0.0
              BLUEBUBBLES_WEBHOOK_PORT: "8645"
              BLUEBUBBLES_WEBHOOK_PATH: /bluebubbles-webhook
              BLUEBUBBLES_REQUIRE_MENTION: "true"
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
            args: [--auth, password, --user-data-dir, /opt/data/.vscode, --extensions-dir, /opt/data/.vscode, --port, "12321", /opt/data/workspace]
            env:
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: CODESERVER_PASSWORD
              TZ: Australia/Sydney
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: false
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
          dashboard:
            image: *image
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              GATEWAY_HEALTH_URL: http://localhost:8642
              TZ: Australia/Sydney
            command: ["/opt/hermes/bin/hermes"]
            args:
              - dashboard
              - --host
              - 0.0.0.0
              - --insecure
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              limits:
                memory: 512Mi
          serve:
            image: *image
            command: ["/opt/hermes/bin/hermes"]
            args:
              - serve
              - --host
              - 0.0.0.0
              - --port
              - "9120"
            env:
              PATH: /usr/local/bin:/usr/bin:/bin
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Australia/Sydney
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-serve
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-serve.goyangi.io
            envFrom:
              - secretRef:
                  name: hermes
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 8642
          codeserver:
            port: 12321
      dashboard:
        controller: hermes
        ports:
          http:
            port: 9119
      webhook:
        controller: hermes
        ports:
          http:
            port: 8645
      serve:
        controller: hermes
        ports:
          http:
            port: 9120
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      media:
        type: nfs
        server: nas.internal
        path: /mnt/world/media
        globalMounts:
          - path: /media
            readOnly: true
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      skill-homelab-commit-watcher:
        type: configMap
        name: hermes-skill-homelab-commit-watcher
        defaultMode: 0755
        advancedMounts:
          hermes:
            install-homelab-commit-watcher:
              - path: /run/skills/homelab-commit-watcher
      webui-agent:
        type: emptyDir
        advancedMounts:
          hermes:
            init-webui-agent:
              - path: /webui-agent
            webui:
              - path: /home/hermeswebui/.hermes/hermes-agent
                readOnly: true
