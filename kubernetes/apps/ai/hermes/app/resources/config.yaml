_config_version: 44
model:
  default: reasoning-pool
  provider: litellm
  base_url: http://litellm.ai.svc.cluster.local:4000/v1
providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    api_key: ${OPENAI_API_KEY}
    default_model: reasoning-pool
    transport: chat_completions
moa:
  presets:
    default:
      enabled: false
toolsets:
  - hermes-cli
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  home_mode: auto
  lifetime_seconds: 300
# Under gateway.multiplex_profiles the satellite profiles have no platform
# credentials of their own (holding one would be a duplicate_credential fatal) —
# the primary gateway owns the adapters and delivers their cron output. But cron
# preflight's delivery check runs inside the scrubbed worker env, sees an empty
# `get_connected_platforms()`, and blocks every matrix-delivering job before an
# LLM call is made. Its multiplex escape hatch only fires for satellite profiles
# declared in the primary's gateway.profile_routes, and this home IS the primary,
# so there is nothing to consult. Delivery itself is unaffected: the worker
# queues the final send on the delivery queue and the live gateway adapter
# claims it, so the worker does not need the credentials. Disable the
# pre-dispatch config checks so these jobs run; provider-key and skill problems
# still surface at runtime as failures in `hermes cron doctor` and incidents.
cron:
  preflight: false
compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.20
  tail_mode: lean
  protect_last_n: 12
  min_tail_user_messages: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 2048
  idle_compact_after_seconds: 3600
agent:
  max_turns: 60
  text_verbosity: high
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  verify_on_stop: false
kanban:
  # Cap concurrent Kanban workers. Every worker runs on kanban-pool, which
  # routes to OpenRouter — so this is the direct spend ceiling. Left unset,
  # the dispatcher derives it from host memory and picks 8.
  max_in_progress: 2
updates:
  pre_update_backup: false
streaming:
  enabled: false
security:
  redact_secrets: true
privacy:
  redact_pii: true
memory:
  provider: honcho
  # NB: do not add a honcho_url key here - nothing reads it. The plugin resolves
  # the URL from HONCHO_BASE_URL (or honcho.json), set on the app container env
  # in the HelmRelease. A key here silently falls back to Honcho cloud.
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 40000
  user_char_limit: 12000
  nudge_interval: 10
  flush_min_turns: 6
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
approvals:
  mode: "off"
  cron_mode: "approve"
max_concurrent_sessions: 5
group_sessions_per_user: true
dashboard:
  public_url: https://hermes.goyangi.io
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://id.goyangi.io/
      client_id: hermes-dashboard
      scopes: "openid profile email"
skills:
  creation_nudge_interval: 15
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
tts:
  provider: openai
  openai:
    model: kokoro
    base_url: http://mac.internal:8765/v1
stt:
  provider: openai
  openai:
    model: parakeet
    base_url: http://mac.internal:8765/v1
voice:
  auto_tts: true
delegation:
  max_iterations: 250
platform_toolsets:
  cli:
    - hermes-cli
display:
  tool_progress_command: true
  show_reasoning: false
  platforms:
    matrix:
      tool_progress: new
      tool_progress_grouping: accumulate
      # Terse busy acks: keeps the "working" indicator, drops the per-iteration
      # and per-tool detail (upstream default is the verbose form).
      busy_ack_detail: false
      # No 40-char tool-argument previews in progress lines (upstream sets 40);
      # shortens each line and keeps tool input such as paths out of chat.
      tool_preview_length: 0
      interim_assistant_messages: true
      long_running_notifications: true
auxiliary:
  vision:
    provider: main
    timeout: 30
  web_extract:
    provider: main
    timeout: 120
  tts_audio_tags:
    provider: main
    timeout: 30
  session_search:
    provider: main
    timeout: 30
    max_concurrency: 3
platforms:
  matrix:
    enabled: true
matrix:
  allowed_users:
    - "@andrew:goyangi.io"
  session_scope: room
  auto_thread: false
onboarding:
  seen:
    profile_build_offered: true
mcp_servers:
  toolhive:
    url: "http://vmcp-mcp-gateway.ai.svc:4483/mcp"
