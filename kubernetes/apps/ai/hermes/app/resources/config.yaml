_config_version: 44
model:
  default: reasoning-pool
  provider: litellm
  openai_runtime: codex_app_server
  base_url: http://litellm.ai.svc.cluster.local:4000/v1
  fallback: '["opencode-go-reasoning"]'
providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    api_key: ${OPENAI_API_KEY}
    default_model: reasoning-pool
    transport: chat_completions
moa:
  presets:
    default:
      enabled: false
toolsets:
  - hermes-cli
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  home_mode: auto
  lifetime_seconds: 300
compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.20
  tail_mode: lean
  protect_last_n: 12
  min_tail_user_messages: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 2048
  idle_compact_after_seconds: 3600
agent:
  max_turns: 60
  text_verbosity: high
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  verify_on_stop: false
updates:
  pre_update_backup: false
streaming:
  enabled: false
security:
  redact_secrets: true
privacy:
  redact_pii: true
memory:
  provider: honcho
  honcho_url: http://honcho.ai.svc.cluster.local
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 40000
  user_char_limit: 12000
  nudge_interval: 10
  flush_min_turns: 6
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
approvals:
  mode: "off"
  cron_mode: "approve"
max_concurrent_sessions: 5
group_sessions_per_user: true
dashboard:
  public_url: https://hermes.goyangi.io
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://id.goyangi.io/
      client_id: hermes-dashboard
      scopes: "openid profile email"
skills:
  creation_nudge_interval: 15
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
tts:
  provider: openai
  openai:
    model: kokoro
    base_url: http://mac.internal:8765/v1
stt:
  provider: openai
  openai:
    model: parakeet
    base_url: http://mac.internal:8765/v1
voice:
  auto_tts: true
delegation:
  max_iterations: 250
platform_toolsets:
  cli:
    - hermes-cli
display:
  tool_progress_command: true
  show_reasoning: false
  platforms:
    matrix:
      tool_progress: new
      tool_progress_grouping: accumulate
      interim_assistant_messages: true
      busy_ack_detail: true
      long_running_notifications: true
auxiliary:
  vision:
    provider: main
    timeout: 30
  web_extract:
    provider: main
    timeout: 120
  tts_audio_tags:
    provider: main
    timeout: 30
  session_search:
    provider: main
    timeout: 30
    max_concurrency: 3
platforms:
  matrix:
    enabled: true
matrix:
  allowed_users:
    - "@andrew:goyangi.io"
  session_scope: room
  auto_thread: false
onboarding:
  seen:
    profile_build_offered: true
mcp_servers:
  toolhive:
    url: "http://vmcp-mcp-gateway.ai.svc:4483/mcp"
