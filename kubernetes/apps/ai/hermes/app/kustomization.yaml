# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./oidc.yaml
  - ./role.yaml
  - ./rolebinding.yaml
  - ./clusterrole.yaml
  - ./clusterrolebinding.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
  - name: hermes-honcho
    files:
      - ./resources/honcho.json
  - name: hermes-matrix-adapter-patch
    files:
      - ./resources/matrix_adapter_patch.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
