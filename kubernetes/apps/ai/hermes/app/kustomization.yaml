# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./oidc.yaml
  - ./role.yaml
  - ./rolebinding.yaml
  - ./clusterrole.yaml
  - ./clusterrolebinding.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
  - name: hermes-honcho
    files:
      - ./resources/honcho.json
  - name: hermes-profile-souls
    files:
      - counsel.SOUL.md=./resources/profiles/counsel/SOUL.md
      - lore.SOUL.md=./resources/profiles/lore/SOUL.md
      - nexus.SOUL.md=./resources/profiles/nexus/SOUL.md
      - pulse.SOUL.md=./resources/profiles/pulse/SOUL.md
      - quest.SOUL.md=./resources/profiles/quest/SOUL.md
      - tinker.SOUL.md=./resources/profiles/tinker/SOUL.md
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
