# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./oidc.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
    options:
      disableNameSuffixHash: true
  - name: hermes-skill-homelab-commit-watcher
    files:
      - ./resources/skills/homelab-commit-watcher/SKILL.md
      - ./resources/skills/homelab-commit-watcher/fetch_k8s_repos.py
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
