---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    creationPolicy: Owner
    template:
      data:
        BLUEBUBBLES_ALLOWED_USERS: "{{ .HERMES_BLUEBUBBLES_ALLOWED_USERS }}"
        BLUEBUBBLES_PASSWORD: "{{ .BLUEBUBBLES_PASSWORD }}"
        OP_SERVICE_ACCOUNT_TOKEN: "{{ .OP_SERVICE_ACCOUNT_TOKEN }}"
        OPENAI_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        FORGEJO_TOKEN: "{{ .FORGEJO_TOKEN }}"
        INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN }}"
        HOMELAB_GH_TOKEN: "{{ .GITHUB_TOKEN }}"
        SUMMARY_LLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        SUMMARY_LLM_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
        SUMMARY_LLM_MODEL: "cron-pool"
        CODESERVER_PASSWORD: "{{ .HERMES_API_SERVER_KEY }}"
        API_SERVER_KEY: "{{ .HERMES_API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: 1password
    - extract:
        key: bluebubbles
    - extract:
        key: honcho
    - extract:
        key: litellm
    - extract:
        key: matrix
    - extract:
        key: forgejo
    - extract:
        key: influxdb
    - extract:
        key: github
    - extract:
        key: hermes
