---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    creationPolicy: Owner
    template:
      data:
        BLUEBUBBLES_ALLOWED_USERS: "{{ .HERMES_BLUEBUBBLES_ALLOWED_USERS }}"
        BLUEBUBBLES_PASSWORD: "{{ .BLUEBUBBLES_PASSWORD }}"
        OP_SERVICE_ACCOUNT_TOKEN: "{{ .OP_SERVICE_ACCOUNT_TOKEN }}"
        OPENAI_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Matrix gateway identity. E2EE is required; the bot keeps the same
        # device across restarts (device ID from the original login response)
        # and reuses its crypto store at /opt/data/platforms/matrix/store/.
        MATRIX_HOMESERVER: "https://matrix.goyangi.io"
        MATRIX_USER_ID: "@hawow:goyangi.io"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_BOT_ACCESS_TOKEN }}"
        MATRIX_DEVICE_ID: "{{ .MATRIX_BOT_DEVICE_ID }}"
        MATRIX_RECOVERY_KEY: "{{ .MATRIX_BOT_RECOVERY_KEY }}"
        MATRIX_E2EE_MODE: "required"
        HONCHO_API_KEY: "{{ .HONCHO_API_KEY }}"
        FORGEJO_TOKEN: "{{ .FORGEJO_TOKEN }}"
        INFLUXDB_TOKEN: "{{ .INFLUXDB_TOKEN }}"
        API_SERVER_KEY: "{{ .HERMES_API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: 1password
    - extract:
        key: bluebubbles
    - extract:
        key: honcho
    - extract:
        key: litellm
    - extract:
        key: matrix
    - extract:
        key: forgejo
    - extract:
        key: influxdb
    - extract:
        key: hermes
