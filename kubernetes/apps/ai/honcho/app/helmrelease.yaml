---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: honcho
spec:
  chartRef:
    kind: OCIRepository
    name: honcho
  interval: 10m
  values:
    controllers:
      honcho:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            env: &env
              - name: TZ
                value: Australia/Sydney
              - name: AUTH_USE_AUTH
                value: "false"
              - name: EMBEDDING_VECTOR_DIMENSIONS
                value: "384"
              - name: CACHE_ENABLED
                value: "true"
              - name: CACHE_URL
                value: redis://redis.storage.svc.cluster.local:6379/0?suppress=true
              - name: LLM_OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: LITELLM_MASTER_KEY
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: LITELLM_MASTER_KEY
              - name: OPENAI_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: DERIVER_MODEL_CONFIG__TRANSPORT
                value: openai
              - name: DERIVER_MODEL_CONFIG__MODEL
                value: cron-pool
              - name: DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: DERIVER_MODEL_CONFIG__STRUCTURED_OUTPUT_MODE
                value: json_object
              - name: SUMMARY_MODEL_CONFIG__TRANSPORT
                value: openai
              - name: SUMMARY_MODEL_CONFIG__MODEL
                value: cron-pool
              - name: SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: LLM_MODEL_CONFIG__TRANSPORT
                value: openai
              - name: LLM_MODEL_CONFIG__MODEL
                value: reasoning-pool
              - name: LLM_MODEL_CONFIG__OVERRIDES__BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: EMBEDDING_MODEL_CONFIG__TRANSPORT
                value: openai
              - name: EMBEDDING_MODEL_CONFIG__MODEL
                value: bge-small-en
              - name: EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL
                value: http://bge-small-en.ai.svc.cluster.local:8080/v1
              - name: EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: LITELLM_MASTER_KEY
            envFrom:
              - secretRef:
                  name: honcho-secret
          init-extensions:
            dependsOn: init-db
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            env:
              PGHOST: postgres-rw.storage.svc.cluster.local
              PGUSER: postgres
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: INIT_POSTGRES_SUPER_PASS
              PGDATABASE: honcho
            command: ["/bin/bash", "-c"]
            args:
              - psql -c "CREATE EXTENSION IF NOT EXISTS vector CASCADE;"
        containers:
          app:
            image:
              repository: ghcr.io/plastic-labs/honcho
              tag: v3.1.1@sha256:0f989114cab71424aabcd8ce7752ba086916abdeaef54b347ce99142c891e0ba
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                /app/.venv/bin/python scripts/provision_db.py
                /app/.venv/bin/python scripts/configure_embeddings.py --yes
                exec /app/.venv/bin/fastapi run --host "0.0.0.0" src/main.py
            env: *env
            envFrom:
              - secretRef:
                  name: honcho-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext: &security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
          deriver:
            image:
              repository: ghcr.io/plastic-labs/honcho
              tag: v3.1.1@sha256:0f989114cab71424aabcd8ce7752ba086916abdeaef54b347ce99142c891e0ba
            command: ["/bin/sh", "-c"]
            args:
              - exec /app/.venv/bin/python -m src.deriver
            env: *env
            envFrom:
              - secretRef:
                  name: honcho-secret
            securityContext: *security
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    persistence:
      config-toml:
        type: configMap
        name: honcho-configmap
        globalMounts:
          - path: /app/config.toml
            subPath: config.toml
            readOnly: true
      tmp:
        type: emptyDir
