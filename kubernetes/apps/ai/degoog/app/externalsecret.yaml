---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: degoog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: degoog-secret
    creationPolicy: Owner
    template:
      data:
        DEGOOG_SETTINGS_PASSWORDS: "{{ .DEGOOG_SETTINGS_PASSWORD }}"
        DEGOOG_MCP_AUTH_TOKEN: "{{ .DEGOOG_MCP_AUTH_TOKEN }}"
        # The MCP sidecar requires the "Bearer " scheme on /mcp, and the MCP
        # gateway proxy can only inject a header value verbatim. Render the
        # prefixed form here so neither end has to duplicate the token.
        DEGOOG_MCP_AUTHORIZATION: "Bearer {{ .DEGOOG_MCP_AUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: degoog
