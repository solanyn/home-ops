---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  targetNamespace: ai
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: storage
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/app
  postBuild:
    substitute:
      APP: litellm
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      KOPIUR_PGID: 0
      KOPIUR_PUID: 0
      KOPIUR_STORAGECLASS: miroir-replicated
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
