---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm-database:v1.104.0@sha256:fbe28229d2d02181c0a7d9df9599de614b491f3d897d2d7da18404f088310218
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      memory: 4Gi
  envFrom:
    - secretRef:
        name: litellm
  env:
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: CHATGPT_TOKEN_DIR
      value: /var/lib/litellm/chatgpt
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://id.goyangi.io/authorize
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://id.goyangi.io/api/oidc/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://id.goyangi.io/api/oidc/userinfo
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: https://litellm.goyangi.io
    - name: REDIS_HOST
      value: redis.storage.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: OPENCODE_GO_API_BASE
      value: https://opencode.ai/zen/go/v1
    - name: OPENCODE_ZEN_API_BASE
      value: https://opencode.ai/zen/v1
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc
          key: client_secret
  routerSettings:
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    num_retries: 2
    fallbacks:
      - frontier-pool: [coding-pool, simple-pool]
      - coding-pool: [simple-pool]
  litellmSettings:
    drop_params: true
    request_timeout: 1200
    num_retries: 2
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  volumes:
    - name: chatgpt-auth
      persistentVolumeClaim:
        claimName: litellm
  volumeMounts:
    - name: chatgpt-auth
      mountPath: /var/lib/litellm/chatgpt
  route:
    hostnames:
      - litellm.goyangi.io
    parentRefs:
      - name: envoy-external
        namespace: network
  service:
    port: 4000
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-56-luna
spec:
  modelName: chatgpt/gpt-5.6-luna
  proxyRef: litellm
  params:
    model: chatgpt/gpt-5.6-luna
  info:
    mode: responses
    maxInputTokens: 1050000
    supportsFunctionCalling: true
