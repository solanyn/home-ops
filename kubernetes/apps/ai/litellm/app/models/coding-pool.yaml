---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coding-pool-opencode-go
spec:
  modelName: coding-pool
  proxyRef: litellm
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://opencode.ai/inference/go/openai/v1
    apiKeyRef:
      name: litellm
      key: OPENCODE_API_KEY
    additional:
      order: 1
      provider_affinity_header: x-opencode-session
      extra_headers:
        User-Agent: litellm/v1.108.2
  info:
    mode: chat
    maxInputTokens: 1000000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 3.0e-07
      output_cost_per_token: 1.2e-06
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coding-pool-qwen
spec:
  modelName: coding-pool
  proxyRef: litellm
  params:
    model: openrouter/qwen/qwen3.8-27b
    apiKeyRef:
      name: litellm
      key: OPENROUTER_API_KEY
    additional:
      order: 2
      reasoning_effort: medium
      allowed_openai_params: [reasoning_effort]
      extra_body:
        provider:
          zdr: true
          require_parameters: true
  info:
    mode: chat
    maxInputTokens: 1000000
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 4.25e-07
      output_cost_per_token: 2.55e-06
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coding-pool-gemma
spec:
  modelName: coding-pool
  proxyRef: litellm
  params:
    model: openrouter/google/gemma-4-26b-a4b-it
    apiKeyRef:
      name: litellm
      key: OPENROUTER_API_KEY
    additional:
      order: 3
      extra_body:
        provider:
          zdr: true
          require_parameters: true
  info:
    mode: chat
    maxInputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
