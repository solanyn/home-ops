---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: litellm-chatgpt-auth
  labels:
    vmalert.datasource: victoria-logs
spec:
  groups:
    - name: litellm-auth.rules
      type: vlogs
      interval: 30s
      rules:
        # Fires only when ChatGPT rejected a request, i.e. the allowance is already
        # gone. Grouping by the window (300 min = 5-hour, 10080 min = weekly) yields
        # exactly one series per window: grouping by pod duplicated alerts, grouping
        # by resets_at flapped because replicas report it one second apart, and
        # emitting both a count and a reset series produced one duplicate series per
        # window. The reset time is therefore the single exported value ($value).
        # Prefer the exporter's chatgpt_usage_used_percent metric for advance
        # warning; this rule stays as the authoritative backstop because it proves a
        # request was actually refused.
        - alert: LiteLLMChatGPTUsageLimitReached
          expr: |-
            kubernetes.pod_name:~"litellm-.*" "usage_limit_reached"
            | extract "resets_at\x22:<resets_at>," from _msg
            | extract "limit_window_minutes\x22:<window_minutes>," from _msg
            | stats by (window_minutes) max(resets_at) as resets_at
            | filter resets_at:>0
          keep_firing_for: 15m
          annotations:
            summary: 'LiteLLM ChatGPT {{ if eq $labels.window_minutes "10080" }}weekly{{ else if eq $labels.window_minutes "300" }}5-hour{{ else }}{{ $labels.window_minutes }}-minute{{ end }} usage limit reached'
            description: >-
              ChatGPT rejected a request because its {{ if eq $labels.window_minutes "10080" }}weekly{{ else if eq $labels.window_minutes "300" }}5-hour{{ else }}unknown{{ end }}
              allowance is exhausted. Allowance resets at unix {{ $value }}. Fallback models
              may be serving requests.{{ if eq $labels.window_minutes "10080" }} This is the
              weekly window: the 5-hour window recovering does not restore overall headroom.{{ end }}
          labels:
            severity: critical
            category: capacity
            window_minutes: "{{ $labels.window_minutes }}"
        - alert: LiteLLMChatGPTAuthenticationRequired
          expr: |-
            kubernetes.pod_name:~"litellm-.*" "Enter code:"
            | extract "2) Enter code: <device_code>" from _msg
            | stats by (device_code, kubernetes.pod_name) count() as matches
            | filter matches:>0
          keep_firing_for: 15m
          annotations:
            summary: LiteLLM requires ChatGPT authentication
            description: Authenticate at https://auth.openai.com/codex/device with code {{ $labels.device_code }}
            auth_url: https://auth.openai.com/codex/device
            device_code: "{{ $labels.device_code }}"
            pod: '{{ index $labels "kubernetes.pod_name" }}'
          labels:
            severity: critical
            category: authentication
