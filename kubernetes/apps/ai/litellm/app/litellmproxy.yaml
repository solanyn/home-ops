---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
    name: main
spec:
    replicas: 1
    resources:
        requests:
            cpu: 250m
            memory: 2Gi
        limits:
            cpu: 2000m
            memory: 4Gi
    generalSettings:
        master_key: os.environ/LITELLM_MASTER_KEY
        database_url: os.environ/DATABASE_URL
    routerSettings:
        routing_strategy: simple-shuffle
        num_retries: 3
        timeout: 60
        request_timeout: 120
        retry_policy:
            BadRequestErrorRetries: 1
            AuthenticationErrorRetries: 1
            TimeoutErrorRetries: 3
            RateLimitErrorRetries: 3
            InternalServerErrorRetries: 3
    callbacks:
        success:
            - prometheus
            - otel
    env:
        - name: PROXY_BASE_URL
          value: https://litellm.goyangi.io
        - name: GENERIC_CLIENT_ID
          value: litellm
        - name: GENERIC_CLIENT_SECRET
          valueFrom:
              secretKeyRef:
                  name: litellm-oidc
                  key: client_secret
        - name: GENERIC_AUTHORIZATION_ENDPOINT
          value: https://id.goyangi.io/authorize
        - name: GENERIC_TOKEN_ENDPOINT
          value: https://id.goyangi.io/api/oidc/token
        - name: GENERIC_USERINFO_ENDPOINT
          value: https://id.goyangi.io/api/oidc/userinfo
        # OpenTelemetry V2 — traces to VTSingle
        - name: LITELLM_OTEL_V2
          value: "true"
        - name: OTEL_EXPORTER
          value: otlp_grpc
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://vtsingle-goyangi-otel.o11y.svc:4317
        - name: OTEL_SERVICE_NAME
          value: litellm
        - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
          value: span_and_event
        - name: LITELLM_OTEL_INTEGRATION_ENABLE_METRICS
          value: "true"
        - name: LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS
          value: "true"
    envFrom:
        - secretRef:
              name: litellm-secret
    route:
        hostnames:
            - litellm.goyangi.io
        parentRefs:
            - name: envoy-external
              namespace: network
