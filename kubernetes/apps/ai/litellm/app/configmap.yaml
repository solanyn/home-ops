---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      - model_name: chatgpt/gpt-5.6-luna
        model_info:
          mode: responses
          input_cost_per_token: 0.0000002
          cache_creation_input_token_cost: 0.00000025
          cache_read_input_token_cost: 0.00000002
          output_cost_per_token: 0.0000012
          max_input_tokens: 1050000
        litellm_params:
          model: chatgpt/gpt-5.6-luna
      - model_name: chatgpt/gpt-5.6-sol
        model_info:
          mode: responses
          input_cost_per_token: 0.000005
          cache_creation_input_token_cost: 0.00000625
          cache_read_input_token_cost: 0.0000005
          output_cost_per_token: 0.00003
          max_input_tokens: 1100000
        litellm_params:
          model: chatgpt/gpt-5.6-sol
      # OpenRouter catalogue: only affordable chat/tool models with current
      # model IDs and ZDR-capable endpoints. Keep these aliases stable for
      # Hermes, Kanban and cron jobs; do not point callers at provider IDs.
      - model_name: cron-pool
        model_info:
          mode: chat
          input_cost_per_token: 0.00000008
          output_cost_per_token: 0.00000013
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3.5-9b
          api_key: os.environ/OPENROUTER_API_KEY
          order: 1
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: kanban-pool
        model_info:
          mode: chat
          input_cost_per_token: 0.000000195
          output_cost_per_token: 0.00000156
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3.5-27b
          api_key: os.environ/OPENROUTER_API_KEY
          order: 1
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/qwen3.5-9b
        model_info:
          mode: chat
          input_cost_per_token: 0.00000008
          output_cost_per_token: 0.00000013
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3.5-9b
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/qwen3.5-27b
        model_info:
          mode: chat
          input_cost_per_token: 0.000000195
          output_cost_per_token: 0.00000156
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3.5-27b
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/qwen3.5-35b-a3b
        model_info:
          mode: chat
          input_cost_per_token: 0.00000015
          output_cost_per_token: 0.000001
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3.5-35b-a3b
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/qwen3-coder-30b
        model_info:
          mode: chat
          input_cost_per_token: 0.00000007
          output_cost_per_token: 0.00000028
          supports_function_calling: true
        litellm_params:
          model: openrouter/qwen/qwen3-coder-30b-a3b-instruct
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/glm-4.7-flash
        model_info:
          mode: chat
          input_cost_per_token: 0.0000000605
          output_cost_per_token: 0.0000004
          supports_function_calling: true
        litellm_params:
          model: openrouter/z-ai/glm-4.7-flash
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: openrouter/deepseek-v3.2
        model_info:
          mode: chat
          input_cost_per_token: 0.00000028
          output_cost_per_token: 0.00000042
          supports_function_calling: true
        litellm_params:
          model: openrouter/deepseek/deepseek-v3.2
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true
              require_parameters: true
      - model_name: qwen3-embedding
        model_info:
          mode: embedding
        litellm_params:
          model: openai/qwen3-embedding-0.6b-4bit-DWQ
          api_base: http://qwen3-embedding.ai.svc.cluster.local:8080/v1
          api_key: sk-local
      - model_name: reasoning-pool
        model_info:
          mode: responses
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna
          order: 1
      - model_name: reasoning-pool
        model_info:
          mode: responses
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-sol
          order: 2
      - model_name: frontier-pool
        model_info:
          mode: responses
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-sol
          order: 1
      - model_name: frontier-pool
        model_info:
          mode: responses
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna
          order: 2
      - model_name: chatgpt/gpt-5.4
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-5.4
      - model_name: chatgpt/gpt-5.3-codex
        model_info:
          mode: responses
        litellm_params:
          model: chatgpt/gpt-5.3-codex
    general_settings:
      health_check_endpoint: /v1/health
      store_model_in_db: false
    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      routing_strategy: simple-shuffle
      cooldown_time: 30
      enable_pre_call_checks: true
      fallbacks:
        - chatgpt/gpt-5.6-luna: [openrouter/deepseek-v3.2, openrouter/qwen3.5-27b]
        - chatgpt/gpt-5.6-sol: [openrouter/deepseek-v3.2, openrouter/qwen3.5-27b]
        - reasoning-pool: [openrouter/deepseek-v3.2, openrouter/qwen3.5-27b]
        - frontier-pool: [reasoning-pool, openrouter/glm-4.7-flash, openrouter/deepseek-v3.2]
    litellm_settings:
      success_callback: [prometheus]
      failure_callback: [prometheus]
      prometheus_adapter: true
      require_auth_for_metrics_endpoint: false
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        ttl: 300
      drop_params: true
      request_timeout: 1200
      num_retries: 2
      retry_after: 5
