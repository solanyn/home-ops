        general_settings:
          health_check_endpoint: /v1/health
          store_model_in_db: false
        router_settings:
          redis_host: os.environ/REDIS_HOST
          redis_port: os.environ/REDIS_PORT
          routing_strategy: simple-shuffle
          cooldown_time: 30
          enable_pre_call_checks: true
          fallbacks:
            - chatgpt/gpt-5.6-sol: [frontier-pool]
            - chatgpt/gpt-5.6-luna: [reasoning-pool]
            - oc-hy3-preview: [oc-deepseek-v4-flash, minimax-m2.7]
            - oc-deepseek-v4-flash: [minimax-m2.7]
          context_window_fallbacks:
            - oc-deepseek-v4-flash: [chatgpt/gpt-5.6-luna]
            - minimax-m2.7: [chatgpt/gpt-5.6-luna]
        litellm_settings:
          success_callback: [prometheus]
          failure_callback: [prometheus]
          prometheus_adapter: true
          require_auth_for_metrics_endpoint: false
          cache: true
          cache_params:
            type: redis
            host: os.environ/REDIS_HOST
            port: os.environ/REDIS_PORT
            ttl: 300
          drop_params: true
          request_timeout: 1200
          num_retries: 2
          retry_after: 5
