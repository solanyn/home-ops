---
apiVersion: v1
kind: ConfigMap
metadata:
    name: litellm-configmap
data:
    config.yaml: |
        model_list:
          - model_name: chatgpt/gpt-5.6-sol
            model_info:
              mode: responses
              input_cost_per_token: 0.000005
              cache_creation_input_token_cost: 0.00000625
              cache_read_input_token_cost: 0.0000005
              output_cost_per_token: 0.00003
              max_input_tokens: 1100000
            litellm_params:
              model: chatgpt/gpt-5.6-sol
          - model_name: chatgpt/gpt-5.6-terra
            model_info:
              mode: responses
              input_cost_per_token: 0.000002
              cache_creation_input_token_cost: 0.0000025
              cache_read_input_token_cost: 0.0000002
              output_cost_per_token: 0.000012
              max_input_tokens: 1050000
            litellm_params:
              model: chatgpt/gpt-5.6-terra
          - model_name: chatgpt/gpt-5.6-luna
            model_info:
              mode: responses
              input_cost_per_token: 0.0000002
              cache_creation_input_token_cost: 0.00000025
              cache_read_input_token_cost: 0.00000002
              output_cost_per_token: 0.0000012
              max_input_tokens: 1050000
            litellm_params:
              model: chatgpt/gpt-5.6-luna
          - model_name: deepseek-v4-flash
            model_info:
              mode: chat
              input_cost_per_token: 0.00000014
              cache_creation_input_token_cost: 0.00000014
              cache_read_input_token_cost: 0.0000000028
              output_cost_per_token: 0.00000028
              max_input_tokens: 1000000
              max_output_tokens: 16384
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/deepseek-v4-flash
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
          - model_name: deepseek-v4-pro
            model_info:
              mode: chat
              input_cost_per_token: 0.000000435
              cache_creation_input_token_cost: 0.000000435
              cache_read_input_token_cost: 0.0000000036
              output_cost_per_token: 0.00000087
              max_input_tokens: 1000000
              max_output_tokens: 16384
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/deepseek-v4-pro
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              extra_body:
                thinking:
                  type: disabled
              merge_reasoning_content_in_choices: true
          - model_name: mimo-v2.5-pro
            model_info:
              mode: chat
              input_cost_per_token: 0.000000435
              cache_creation_input_token_cost: 0.000000435
              cache_read_input_token_cost: 0.0000000036
              output_cost_per_token: 0.00000087
              max_input_tokens: 262144
              max_output_tokens: 16384
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/mimo-v2.5-pro
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
          - model_name: mimo-v2.5
            model_info:
              mode: chat
              input_cost_per_token: 0.00000014
              cache_creation_input_token_cost: 0.00000014
              cache_read_input_token_cost: 0.0000000028
              output_cost_per_token: 0.00000028
              max_input_tokens: 262144
              max_output_tokens: 16384
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/mimo-v2.5
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
          - model_name: qwen3.7-plus
            model_info:
              mode: chat
              input_cost_per_token: 0.0000004
              cache_creation_input_token_cost: 0.0000005
              cache_read_input_token_cost: 0.00000004
              output_cost_per_token: 0.0000016
              max_input_tokens: 1000000
              max_output_tokens: 16384
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/qwen3.7-plus
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
          - model_name: qwen3.8-max
            model_info:
              mode: chat
              input_cost_per_token: 0.000002
              cache_creation_input_token_cost: 0.0000025
              cache_read_input_token_cost: 0.00000025
              output_cost_per_token: 0.000006
              max_input_tokens: 1000000
              max_output_tokens: 32768
              supports_function_calling: true
              supports_prompt_caching: true
            litellm_params:
              model: openai/qwen3.8-max
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
          - model_name: cron-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/deepseek-v4-flash
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 1
          - model_name: cron-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/mimo-v2.5
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 2
          - model_name: reasoning-pool
            model_info:
              mode: responses
              max_input_tokens: 1050000
            litellm_params:
              model: chatgpt/gpt-5.6-luna
              order: 1
              extra_body:
                reasoning:
                  effort: xhigh
          - model_name: reasoning-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/deepseek-v4-flash
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 2
          - model_name: reasoning-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/qwen3.7-plus
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 3
          - model_name: reasoning-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/mimo-v2.5
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 4
          - model_name: frontier-pool
            model_info:
              mode: responses
              max_input_tokens: 1100000
            litellm_params:
              model: chatgpt/gpt-5.6-sol
              order: 1
          - model_name: frontier-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/qwen3.8-max
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 2
          - model_name: frontier-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/deepseek-v4-pro
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 3
          - model_name: frontier-pool
            model_info:
              mode: chat
              supports_function_calling: true
            litellm_params:
              model: openai/mimo-v2.5-pro
              api_base: https://opencode.ai/zen/go/v1
              api_key: os.environ/OPENCODE_API_KEY
              order: 4
        general_settings:
          health_check_endpoint: /v1/health
          store_model_in_db: false
        router_settings:
          redis_host: os.environ/REDIS_HOST
          redis_port: os.environ/REDIS_PORT
          routing_strategy: priority-based-routing
          cooldown_time: 30
          enable_pre_call_checks: true
          fallbacks:
            - chatgpt/gpt-5.6-sol: [qwen3.8-max, deepseek-v4-pro]
            - chatgpt/gpt-5.6-luna: [deepseek-v4-flash, qwen3.7-plus]
            - deepseek-v4-pro: [mimo-v2.5-pro, qwen3.8-max]
            - deepseek-v4-flash: [mimo-v2.5, qwen3.7-plus]
          context_window_fallbacks:
            - mimo-v2.5: [deepseek-v4-flash, chatgpt/gpt-5.6-luna]
            - mimo-v2.5-pro: [deepseek-v4-pro, chatgpt/gpt-5.6-sol]
        litellm_settings:
          success_callback: [prometheus]
          failure_callback: [prometheus]
          prometheus_adapter: true
          require_auth_for_metrics_endpoint: false
          cache: true
          cache_params:
            type: redis
            host: os.environ/REDIS_HOST
            port: os.environ/REDIS_PORT
            ttl: 300
          drop_params: true
          request_timeout: 1200
          num_retries: 2
          retry_after: 5
