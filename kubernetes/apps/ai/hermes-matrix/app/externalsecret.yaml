---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: https://matrix.goyangi.io
        MATRIX_USER_ID: "@hawow:goyangi.io"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_BOT_ACCESS_TOKEN }}"
        MATRIX_DEVICE_ID: "{{ .MATRIX_BOT_DEVICE_ID }}"
        MATRIX_ALLOWED_USERS: "@andrew:goyangi.io"
        GATEWAY_PROXY_KEY: "{{ .HERMES_API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: matrix
    - extract:
        key: hermes
