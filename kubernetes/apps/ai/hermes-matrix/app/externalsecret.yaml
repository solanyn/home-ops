---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: https://matrix.goyangi.io
        MATRIX_USER_ID: "@hawow:goyangi.io"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_BOT_ACCESS_TOKEN }}"
        MATRIX_DEVICE_ID: "{{ .MATRIX_BOT_DEVICE_ID }}"
        MATRIX_RECOVERY_KEY: "{{ .MATRIX_BOT_RECOVERY_KEY }}"
        MATRIX_ALLOWED_USERS: "@andrew:goyangi.io"
        MATRIX_HOME_ROOM: "!12_EWTBUFG6QBq_b-KblbBRCVqf8ijvRJqIo-T58tP4"
        MATRIX_FREE_RESPONSE_ROOMS: "!12_EWTBUFG6QBq_b-KblbBRCVqf8ijvRJqIo-T58tP4"
        MATRIX_REQUIRE_MENTION: "false"
        MATRIX_SESSION_SCOPE: thread
        MATRIX_AUTO_THREAD: "true"
        MATRIX_PROCESS_NOTICES: "false"
        MATRIX_ALLOW_ROOM_MENTIONS: "false"
        GATEWAY_PROXY_KEY: "{{ .HERMES_API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: matrix
    - extract:
        key: hermes
