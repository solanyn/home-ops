---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      prefix: goyangi
      # Bare host[:port] — no scheme. Served by versitygw (posix backend) on the NAS.
      endpoint: nas.internal:9000
      region: us-east-1
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
  catalog:
    fallbackNamespace: kopiur-system
    periodicRefresh: true
    refreshInterval: 1h
  # A new, empty bucket has to be initialised on first connect.
  create:
    enabled: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    enabled: true
    namespace: kopiur-system
    schedule:
      full:
        cron: "0 3 * * *"
        jitter: 1h
      quick:
        cron: "0 * * * *"
        jitter: 10m
      timezone: Australia/Sydney
    takeoverPolicy: Force
  moverDefaults:
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  mode: ReadWrite
