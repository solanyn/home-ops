---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  interval: 15m
  dependsOn: []
  values:
    grafanaDashboard:
      enabled: true
      folder: database
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
