---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-cluster
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0
  replicas: 2
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    # BullMQ (AFFiNE, and any other Node queue) reads keys it does not pass as
    # KEYS, which Dragonfly refuses by default. Allowing undeclared keys restores
    # Redis semantics at the cost of serialising EVAL calls.
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 768Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
