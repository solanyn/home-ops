---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-databases
spec:
  targetNamespace: storage
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/storage/cloudnative-pg/databases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: silo
      namespace: storage
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      name: silo-owner
      namespace: storage
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      name: silo-app
      namespace: storage
