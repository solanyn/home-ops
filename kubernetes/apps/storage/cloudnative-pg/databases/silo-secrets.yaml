---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-postgres-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-postgres-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: silo_owner
        password: "{{ .SILO_POSTGRES_OWNER_PASSWORD }}"
  dataFrom:
    - extract:
        key: silo
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: silo
        password: "{{ .SILO_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: silo
    - extract:
        key: cloudnative-pg
