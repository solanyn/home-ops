# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: affine-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: affine
        password: "{{ .AFFINE_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: affine
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/role_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: affine-owner
spec:
  cluster:
    name: postgres
  name: affine_owner
  login: true
  createrole: true
  createdb: true
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/role_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: affine-app
spec:
  cluster:
    name: postgres
  name: affine
  login: true
  inRoles:
    - affine_owner
  passwordSecret:
    name: affine-postgres-app
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: affine
spec:
  cluster:
    name: postgres
  name: affine
  owner: affine_owner
  extensions:
    - name: vector
      ensure: present
