---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  values:
    domain: goyangi.io
    fallthrough:
      enabled: true
    ttl: 1
    service:
      ipFamily: IPv4
      ipFamilyPolicy: SingleStack
      port: 53
      type: ClusterIP
      useTcp: true
    watchedResources: ["HTTPRoute", "Service"]
