---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika-central
spec:
  cluster:
    name: postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vchord
      version: "1.1.1"
      ensure: present
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/role_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-central-owner
spec:
  cluster:
    name: postgres
  name: kritika_owner
  login: true
  createrole: true
  createdb: true
  passwordSecret:
    name: kritika-postgres-credentials
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/role_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-central-app
spec:
  cluster:
    name: postgres
  name: kritika_app
  login: true
  inRoles:
    - kritika
  passwordSecret:
    name: kritika-postgres-app
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/role_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-central-runner
spec:
  cluster:
    name: postgres
  name: kritika_runner
  login: true
  inRoles:
    - kritika
  passwordSecret:
    name: kritika-postgres-runner
  databaseRoleReclaimPolicy: retain
