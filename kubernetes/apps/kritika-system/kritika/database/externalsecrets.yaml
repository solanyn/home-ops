---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: &ownerUser kritika_owner
        password: &ownerPass "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        uri: "postgres://kritika_owner:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@postgres-rw.storage.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
        INIT_POSTGRES_HOST: &dbHost postgres-rw.storage.svc.cluster.local
        INIT_POSTGRES_DBNAME: &dbName kritika
        INIT_POSTGRES_USER: postgres
        INIT_POSTGRES_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
