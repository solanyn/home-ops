        uri: "postgres://kritika_app:{{ .KRITIKA_POSTGRES_APP_PASSWORD }}@postgres-rw.storage.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
        INIT_POSTGRES_DBNAME: kritika
        INIT_POSTGRES_USER: kritika_owner
        INIT_POSTGRES_PASS: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
