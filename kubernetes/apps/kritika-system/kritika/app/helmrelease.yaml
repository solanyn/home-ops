---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    replicas: 1
    config:
      webUrl: https://kritika.goyangi.io
      apps:
        github:
          accounts: [solanyn]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
          auth:
            roleMappingExpr: 'user.login == "solanyn" ? "admin" : "none"'
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          apiKey:
            env: KRITIKA_LITELLM_API_KEY
      review:
        model: litellm/kanban-pool
      confidence:
        model: litellm/kanban-pool
      embedding:
        model: litellm/qwen3-embedding
        dims: 1024
    database:
      app:
        existingSecret: kritika-postgres-app
        role: kritika_app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
        role: kritika_runner
    envFrom:
      - secretRef:
          name: kritika-secret
    networkPolicy:
      enabled: true
      services:
        - name: kritika-postgres-rw.kritika-system.svc.cluster.local
          ports:
            - 5432
      egressPorts:
        - 443
      postgresPort: 5432
    runner:
      runtimeClass: gvisor
      deadline: 20m
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    httpRoute:
      enabled: false
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
