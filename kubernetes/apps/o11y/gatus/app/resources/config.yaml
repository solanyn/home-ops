---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Edge VPS
    group: connectivity
    url: icmp://139.99.135.40
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Alertmanager
    group: monitoring
    url: http://vmalertmanager-goyangi.o11y.svc.cluster.local:9093/-/healthy
    interval: 1m
    conditions:
      - "[STATUS] == 200"

external-endpoints:
  - name: home-heartbeat
    token: ${GATUS_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

alerting:
  pushover:
    application-token: ${PUSHOVER_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  link: https://github.com/solanyn
  buttons:
    - name: Github
      link: https://github.com/solanyn
    - name: Homelab
      link: https://github.com/solanyn/home-ops

web:
  port: ${GATUS_WEB_PORT}
