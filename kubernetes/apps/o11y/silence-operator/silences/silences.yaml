---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: nas-memory-high-utilization
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: NodeMemoryHighUtilization
    - name: instance
      value: nas.internal:9100
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
# TODO: remove when new drives or nodes run cooler
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: mounted-drive-high-temperature
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: SmartDeviceHighTemperature
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
# TODO: Remove when no more DockerHub images
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: dockerhub-rate-limit-risk
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: DockerhubRateLimitRisk
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: kube-hpa-maxed-out
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: smart-device-test-failed-nvme0
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: SmartDeviceTestFailed
    - name: device
      value: nvme0
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
# TODO: remove when k8s-1 NVMe replaced or thermals resolved
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: smart-device-critical-warning-nvme0
  namespace: o11y
spec:
  matchers:
    - name: alertname
      value: SmartDeviceCriticalWarning
    - name: device
      value: nvme0
