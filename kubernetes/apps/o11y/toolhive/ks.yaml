---
# Top-level Flux Kustomization for the toolhive operator stack.
# Deploys CRDs, the operator Helm release, configuration resources,
# and MCP server workloads in the correct order.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: toolhive
  namespace: o11y
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/o11y/toolhive/app
