---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-mcp-talosconfig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: talos-mcp-talosconfig
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        talosconfig: |
          context: home-ops
          contexts:
            home-ops:
              endpoints:
                - 192.168.42.10
                - 192.168.42.11
                - 192.168.42.12
              ca: "{{ .CLUSTER_CA_CRT }}"
              crt: "{{ .MACHINE_CA_CRT }}"
              key: "{{ .MACHINE_CA_KEY }}"
  dataFrom:
    - extract:
        key: talos