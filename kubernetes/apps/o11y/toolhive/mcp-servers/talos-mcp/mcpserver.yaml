---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: talos
spec:
  image: ghcr.io/siderolabs/talos-mcp:latest
  transport: streamable-http
  serviceAccount: talos-mcp
  env:
    - name: TALOS_CONFIG_SECRET
      value: talosconfig
    - name: TALOS_CONFIG_NAMESPACE
      value: o11y
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  groupRef:
    name: mcp-tools
