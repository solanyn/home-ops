---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
  namespace: o11y
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-secret
    template:
      data:
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
        UNIFI_HOST: https://192.168.1.1
        UNIFI_VERIFY_SSL: "false"
  dataFrom:
    - extract:
        key: unifi
