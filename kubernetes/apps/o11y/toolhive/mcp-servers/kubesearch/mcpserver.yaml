---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch
  namespace: o11y
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:latest@sha256:2f0b48c90550c2bde2cb54ddb8759a53997b9d5d22f8e532297d08fa1362198c
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    - name: KUBESEARCH_ENABLE_CLONE
      value: "true"
  podTemplateSpec:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubesearch
  groupRef:
    name: mcp-tools
