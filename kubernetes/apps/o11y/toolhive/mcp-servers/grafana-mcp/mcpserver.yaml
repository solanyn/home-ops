---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: grafana-mcp
  namespace: o11y
spec:
  image: grafana/mcp-grafana:1.4.1@sha256:cfcf06863c23b2db64c41b0379d1efe95703aca4ba5434d90674f72ec0b7d810
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.o11y.svc:3000
  secrets:
    - name: grafana-sa-token
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  groupRef:
    name: mcp-tools
