---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
    name: goyangi
    labels:
        app.kubernetes.io/instance: goyangi
spec:
    route:
        receiver: pushover
        repeat_interval: 12h
        routes:
            - receiver: blackhole
              matchers:
                  - alertname=InfoInhibitor
            - receiver: heartbeat
              group_interval: 2m
              group_wait: 0s
              repeat_interval: 2m30s
              matchers:
                  - alertname=Watchdog
            - receiver: pushover
              matchers:
                  - severity=critical
        group_by:
            - alertname
            - cluster
            - job
        group_interval: 5m
        group_wait: 1m
    inhibit_rules:
        - equal:
              - alertname
              - namespace
          source_matchers:
              - severity=critical
          target_matchers:
              - severity=warning
    receivers:
        - name: blackhole
        - name: heartbeat
          webhook_configs:
              - url_secret:
                    name: alertmanager-secret
                    key: ALERTMANAGER_HEARTBEAT_URL
              - url: https://edge-gatus.goyangi.io/api/v1/endpoints/_home-heartbeat/external?success=true
                http_config:
                    bearer_token_secret:
                        name: alertmanager-secret
                        key: GATUS_HEARTBEAT_TOKEN
        - name: pushover
          pushover_configs:
              - send_resolved: true
                sound: gamelan
                title: "Home Ops Alert"
                message: "An alert is firing or has resolved. Open Siren to inspect the current alert state and details."
                url: https://siren.goyangi.io
                url_title: Open in Siren
                priority: "0"
                token:
                    name: alertmanager-secret
                    key: ALERTMANAGER_PUSHOVER_TOKEN
                user_key:
                    name: alertmanager-secret
                    key: PUSHOVER_USER_KEY
