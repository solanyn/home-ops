---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
    name: goyangi
    labels:
        app.kubernetes.io/instance: goyangi
spec:
    route:
        receiver: pushover
        repeat_interval: 12h
        routes:
            - receiver: blackhole
              matchers:
                  - alertname=InfoInhibitor
            - receiver: heartbeat
              group_interval: 2m
              group_wait: 0s
              repeat_interval: 2m30s
              matchers:
                  - alertname=Watchdog
            - receiver: pushover
              matchers:
                  - severity=critical
        group_by:
            - alertname
            - cluster
            - job
        group_interval: 5m
        group_wait: 1m
    inhibit_rules:
        - equal:
              - alertname
              - namespace
          source_matchers:
              - severity=critical
          target_matchers:
              - severity=warning
    receivers:
        - name: blackhole
        - name: heartbeat
          webhook_configs:
              - url_secret:
                    name: alertmanager-secret
                    key: ALERTMANAGER_HEARTBEAT_URL
              - url: https://edge-gatus.goyangi.io/api/v1/endpoints/_home-heartbeat/external?success=true
                http_config:
                    bearer_token_secret:
                        name: alertmanager-secret
                        key: GATUS_HEARTBEAT_TOKEN
        - name: pushover
          pushover_configs:
              - html: true
                send_resolved: true
                sound: gamelan
                title: >-
                    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
                    {{ .CommonLabels.alertname }}
                    {{- if ne .CommonLabels.severity "" }} ({{ .CommonLabels.severity }}){{ end }}
                message: |-
                    {{- $root := . -}}
                    {{- $rm := stringSlice "instance" "kubernetes_node" "endpoint" "prometheus" "service" "cluster" "container" "job" "severity" -}}
                    {{- $common := (($root.CommonLabels.Remove $root.GroupLabels.Names).Remove $rm) -}}
                    {{- if gt (len $common.SortedPairs) 0 }}
                    <b>Common labels</b>
                    {{- range $common.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                    {{- end }}
                    {{- end }}
                    <b>Alerts</b>
                    {{- range .Alerts }}
                    {{- $msg := "Alert description not available" -}}
                    {{- if ne .Annotations.description "" }}{{ $msg = .Annotations.description }}
                    {{- else if ne .Annotations.summary "" }}{{ $msg = .Annotations.summary }}
                    {{- else if ne .Annotations.message "" }}{{ $msg = .Annotations.message }}{{ end }}
                    {{ reReplaceAll "([^\\n])\\n([^\\n])" "$1 $2" $msg | reReplaceAll "\\n" "\\n  " | trimSpace }}
                    <a href="https://siren.goyangi.io">Open in Siren</a>
                    <a href="{{ .GeneratorURL }}">Open source</a>
                    {{- if ne .Annotations.runbook_url "" }}
                    <a href="{{ .Annotations.runbook_url }}">Runbook</a>
                    {{- end }}
                    {{- $uniq := ((.Labels.Remove $root.GroupLabels.Names).Remove $root.CommonLabels.Names) -}}
                    {{- if gt (len $uniq.SortedPairs) 0 }}
                    {{- range $uniq.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                    {{- end }}
                    {{- end }}
                    {{- end }}
                url: https://siren.goyangi.io
                url_title: Open in Siren
                priority: "0"
                token:
                    name: alertmanager-secret
                    key: ALERTMANAGER_PUSHOVER_TOKEN
                user_key:
                    name: alertmanager-secret
                    key: PUSHOVER_USER_KEY
