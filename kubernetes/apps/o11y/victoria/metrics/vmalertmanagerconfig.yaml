---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
    name: goyangi
spec:
    route:
        receiver: pushover
        repeat_interval: 12h
        routes:
            - receiver: blackhole
              matchers:
                  - alertname=InfoInhibitor
            - receiver: heartbeat
              group_interval: 2m
              group_wait: 0s
              repeat_interval: 2m30s
              matchers:
                  - alertname=Watchdog
            - receiver: pushover
              matchers:
                  - severity=critical
        group_by:
            - alertname
            - cluster
            - job
        group_interval: 5m
        group_wait: 1m
    inhibit_rules:
        - equal:
              - alertname
              - namespace
          source_matchers:
              - severity=critical
          target_matchers:
              - severity=warning
    receivers:
        - name: blackhole
        - name: heartbeat
          webhook_configs:
              - url_secret:
                    name: alertmanager-secret
                    key: ALERTMANAGER_HEARTBEAT_URL
        - name: pushover
          pushover_configs:
              - send_resolved: true
                sound: gamelan
                title: "VMAlert"
                priority: "0"
                url_title: View in Alertmanager
                token:
                    name: alertmanager-secret
                    key: ALERTMANAGER_PUSHOVER_TOKEN
                user_key:
                    name: alertmanager-secret
                    key: PUSHOVER_USER_KEY
