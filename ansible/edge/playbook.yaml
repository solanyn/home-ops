---
- name: Bootstrap edge VPS
  hosts: all
  gather_facts: true
  become: true
  vars:
    doco_cd_secrets_dir: /opt/doco-cd
  tasks:
    - name: Install docker dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker compose plugin available
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Create doco-cd directory
      ansible.builtin.file:
        path: "{{ doco_cd_secrets_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy doco-cd compose file
      ansible.builtin.copy:
        src: ../../docker/edge/.doco-cd/docker-compose.app.yaml
        dest: "{{ doco_cd_secrets_dir }}/docker-compose.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: compose_file

    - name: Write 1Password service account token
      ansible.builtin.copy:
        content: "{{ lookup('env', 'OP_EDGE_SERVICE_ACCOUNT_TOKEN') }}"
        dest: "{{ doco_cd_secrets_dir }}/1pw_token"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Write doco-cd API secret
      ansible.builtin.copy:
        content: "{{ lookup('env', 'DOCO_CD_API_SECRET') }}"
        dest: "{{ doco_cd_secrets_dir }}/api_secret"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Write doco-cd webhook secret
      ansible.builtin.copy:
        content: "{{ lookup('env', 'DOCO_CD_WEBHOOK_SECRET') }}"
        dest: "{{ doco_cd_secrets_dir }}/webhook_secret"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Run doco-cd
      community.docker.docker_compose_v2:
        project_src: "{{ doco_cd_secrets_dir }}"
        files:
          - docker-compose.yaml
        pull: always
        state: present

    - name: Wait for doco-cd healthy
      community.docker.docker_container_info:
        name: doco-cd
      register: dococd_info
      until: dococd_info.container.State.Health.Status == "healthy"
      retries: 30
      delay: 10

    - name: Create towonel data directory
      ansible.builtin.file:
        path: /opt/towonel
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"

    - name: Harden SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Restart ssh

    - name: Move SSH to non-standard port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^Port"
        line: "Port 22222"
      notify: Restart ssh

    - name: Lock root password
      ansible.builtin.command: passwd -l root
      changed_when: false

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
