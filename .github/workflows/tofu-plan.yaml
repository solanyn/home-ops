---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tofu Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - opentofu/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Filter
    runs-on: ubuntu-latest
    outputs:
      unifi: ${{ steps.roots.outputs.unifi == 'true' }}
      truenas: ${{ steps.roots.outputs.truenas == 'true' }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: opentofu/**

      - name: Map changed files to roots
        id: roots
        env:
          CHANGED: ${{ steps.changed-files.outputs.changed_files }}
        run: |
          echo "changed: $CHANGED"
          unifi=false
          truenas=false
          # changed_files is a JSON array; one path per iteration.
          for f in $(printf '%s' "$CHANGED" | tr -d '[]"' | tr ',' '\n'); do
              case "$f" in
                  opentofu/unifi/*) unifi=true ;;
                  opentofu/truenas/*) truenas=true ;;
                  *)
                      # Change outside a known root, or at the opentofu/ level:
                      # validate everything so drift cannot hide.
                      unifi=true
                      truenas=true
                      ;;
              esac
          done
          echo "unifi=$unifi" >> "$GITHUB_OUTPUT"
          echo "truenas=$truenas" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.root }})
    needs: filter
    if: ${{ needs.filter.outputs.unifi == 'true' || needs.filter.outputs.truenas == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [unifi, truenas]
    steps:
      - name: Checkout
        if: ${{ needs.filter.outputs[matrix.root] == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        if: ${{ needs.filter.outputs[matrix.root] == 'true' }}
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          tool_versions: |
            opentofu latest

      - name: Init (no backend)
        if: ${{ needs.filter.outputs[matrix.root] == 'true' }}
        working-directory: ./opentofu/${{ matrix.root }}
        run: tofu init -backend=false

      - name: Validate
        if: ${{ needs.filter.outputs[matrix.root] == 'true' }}
        working-directory: ./opentofu/${{ matrix.root }}
        run: tofu validate -no-color

      - name: Unchanged root
        if: ${{ needs.filter.outputs[matrix.root] != 'true' }}
        run: echo "opentofu/${{ matrix.root }} unchanged; nothing to validate"

  # Only unifi is planned in CI. The truenas root needs SSH + WebSocket access
  # to the NAS plus live-only secret substitution, so it is validated here and
  # planned/applied by tofu-controller in-cluster.
  plan:
    name: Plan (unifi)
    needs: [filter, validate]
    if: ${{ needs.filter.outputs.unifi == 'true' }}
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          tool_versions: |
            opentofu latest

      - name: Configure 1Password Connect
        uses: 1password/load-secrets-action/configure@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          connect-host: http://onepassword-connect.external-secrets.svc.cluster.local
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}

      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          UNIFI_API_KEY: op://kubernetes/unifi/UNIFI_API_KEY

      - name: Init (K8s backend)
        working-directory: ./opentofu/unifi
        run: |
          tofu init -reconfigure \
              -backend-config="secret_suffix=unifi" \
              -backend-config="namespace=network" \
              -backend-config="config_path=${KUBECONFIG:-~/.kube/config}"

      # Always write plan-output.txt so the comment step reports the real
      # error instead of failing with ENOENT and hiding it.
      - name: Plan
        id: plan
        working-directory: ./opentofu/unifi
        env:
          UNIFI_API_KEY: ${{ steps.load-secrets.outputs.UNIFI_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          tofu plan -no-color \
              -var="unifi_api_url=https://192.168.10.1" \
              -var="unifi_insecure=true" \
              2>&1 | tee plan-output.txt

      - name: Post Plan Comment
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: plan-output.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.PLAN_FILE)) {
              core.warning('plan-output.txt missing; skipping plan comment');
              return;
            }
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');

            const tag = '## Tofu Plan';
            const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body?.includes(tag)
            );

            const body = `${tag}\n\n\`\`\`\n${plan}\n\`\`\``;

            if (existing) {
                await github.rest.issues.updateComment({
                    ...context.repo,
                    comment_id: existing.id,
                    body,
                });
            } else {
                await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: context.issue.number,
                    body,
                });
            }
