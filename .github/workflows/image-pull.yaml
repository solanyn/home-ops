---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: home-ops-runner
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          tool_versions: |
            jq latest

      - name: Load Secrets from OpenBao
        env:
          AUDIENCE: https://github.com/solanyn
        run: |
          set -euo pipefail
          jwt="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -er '.value')"
          body="$(jq -n --arg role home-ops-ci --arg jwt "$jwt" '{role:$role,jwt:$jwt}')"
          token="$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" \
            https://bao.goyangi.io/v1/auth/jwt-github/login | jq -er '.auth.client_token')"
          data="$(curl -fsS -H "X-Vault-Token: $token" \
            https://bao.goyangi.io/v1/kv/data/ocharted)"
          for ref in OCHARTED_USERNAME OCHARTED_PASSWORD; do
            value="$(printf '%s' "$data" | jq -er ".data.data.${ref}")"
            echo "::add-mask::$value"
            echo "$ref=$value" >> "$GITHUB_ENV"
          done

      - name: Login to ocharted
        run: |
          mkdir -p "$RUNNER_TEMP/ocharted"
          export DOCKER_CONFIG="$RUNNER_TEMP/ocharted"
          printf '%s' "$OCHARTED_PASSWORD" | docker login ocharted.goyangi.io --username "$OCHARTED_USERNAME" --password-stdin

      - name: Extract Images
        id: extract
        run: |
          images=$(flate diff images -p ./kubernetes/apps --allow-missing-kinds Secret,ConfigMap --supply ./.github/flate/render-stubs.yaml --registry-config "$RUNNER_TEMP/ocharted/config.json" -o json)
          {
            echo 'images<<EOF'
            printf '%s\n' "$images"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

  success:
    if: ${{ !cancelled() }}
    needs: [extract, pull]
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
